/* ── 공통 알림 팝업 ──────────────────────────────────────── */
// 테마 정의 (라이트/다크) — 색상 한 곳에서만 관리
const ALERT_THEMES = {
  safety: {
    light: { bg:'#fef3c7', text:'#92400e', btn:'#d97706' },
    dark:  { bg:'#2d1f00', text:'#fde68a', btn:'#b45309' }
  },
  doc: {
    light: { bg:'#dbeafe', text:'#1e40af', btn:'#2563eb' },
    dark:  { bg:'#0d1e30', text:'#93c5fd', btn:'#1d4ed8' }
  }
};

const _alertQueue = [];
let _alertShowing = false;

function showAlertModal({ icon, heading, title, sub, theme }) {
  _alertQueue.push({ icon, heading, title, sub, theme });
  if (!_alertShowing) _nextAlertModal();
}

function _nextAlertModal() {
  if (!_alertQueue.length) { _alertShowing = false; return; }
  _alertShowing = true;

  const { icon, heading, title, sub, theme } = _alertQueue.shift();
  const isDark = document.body.classList.contains('dark');
  const t = (ALERT_THEMES[theme] || ALERT_THEMES.safety)[isDark ? 'dark' : 'light'];

  const wrap = document.createElement('div');
  wrap.id = 'shared-alert-modal-wrap';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);';
  wrap.innerHTML =
    `<div style="width:min(320px,88vw);background:var(--bg-panel);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;">` +
      `<div style="background:${t.bg};padding:20px 20px 16px;text-align:center;">` +
        `<div style="font-size:36px;margin-bottom:8px;">${icon}</div>` +
        `<div style="font-size:16px;font-weight:800;color:${t.text};">${escH(heading)}</div>` +
      `</div>` +
      `<div style="padding:18px 20px;text-align:center;">` +
        `<div style="font-size:15px;font-weight:700;color:var(--text);line-height:1.6;">${escH(title)}</div>` +
        `<div style="font-size:13px;color:var(--text-muted);margin-top:4px;">${escH(sub)}</div>` +
      `</div>` +
      `<div style="padding:0 20px 20px;">` +
        `<button id="alert-ok-btn" style="width:100%;height:42px;background:${t.btn};border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">확인</button>` +
      `</div>` +
    `</div>`;
  document.body.appendChild(wrap);
  document.getElementById('alert-ok-btn').addEventListener('click', () => {
    wrap.remove();
    _nextAlertModal(); // 다음 알림 표시
  });
}

// 오래된 알림 localStorage 키 정리 (prefix 기준, 30일 이전)
function pruneAlertKeys(prefix) {
  const cutoff = fmtDate(new Date(todayDt.getFullYear(), todayDt.getMonth(), todayDt.getDate() - 30));
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith(prefix) && k.slice(prefix.length) < cutoff) localStorage.removeItem(k);
  });
}

/* ── 사용자 정의 메모 알림 ──────────────────────────────── */
function checkMemoAlerts() {
  const shownKey = 'sc_memo_alert_' + TODAY;
  if (localStorage.getItem(shownKey)) return; // 오늘 이미 표시됨

  const tomorrow = fmtDate(new Date(todayDt.getFullYear(), todayDt.getMonth(), todayDt.getDate() + 1));
  const targets = [TODAY, tomorrow];
  const found = []; // { date, text }

  targets.forEach(d => {
    const entry = _monthData[d] || _yearData[d];
    if (!entry?.memo) return;
    entry.memo.forEach(line => {
      if (line.startsWith('알림:')) {
        found.push({ date: d, text: line.replace(/^알림:/, '').trim() });
      }
    });
  });

  if (!found.length) return;
  localStorage.setItem(shownKey, '1');
  pruneAlertKeys('sc_memo_alert_');

  found.forEach(({ date, text }) => {
    const isToday    = date === TODAY;
    const label      = isToday ? '오늘' : '내일';
    const dateLabel  = date.slice(5).replace('-', '/');
    showAlertModal({
      icon: '🔔',
      heading: `${label}(${dateLabel}) 알림`,
      title: text,
      sub: '',
      theme: 'doc'
    });
  });
}

/* ── 안전점검 알림 ───────────────────────────────────────── */
function checkSafetyAlert() {
  if (SHIFT_MAP[_authId]) return;                    // 교대근무자(a/b/c/d) 제외
  const shownKey = 'sc_safety_' + TODAY;
  if (localStorage.getItem(shownKey)) return;

  pruneAlertKeys('sc_safety_');

  const day = todayDt.getDate();
  const checkDays = [4, 14, 24];
  const preDays   = [3, 13, 23];

  let title = null, sub = null;
  if (checkDays.includes(day)) {
    title = `오늘(${day}일)은 안전점검일입니다.`;
    sub   = '점검을 완료해 주세요.';
  } else if (preDays.includes(day)) {
    title = `내일(${day + 1}일)은 안전점검일입니다.`;
    sub   = '미리 준비해 주세요.';
  }

  if (!title) return;
  localStorage.setItem(shownKey, '1');
  showAlertModal({ icon:'🦺', heading:'안전점검 알림', title, sub, theme:'safety' });
}

/* ── 알림문서 발송 알림 (베이스버전 설치 +13/+14일) ───────── */
function checkBaseVersionAlert() {
  const shownKey = 'sc_basever_' + TODAY;
  if (localStorage.getItem(shownKey)) return;

  pruneAlertKeys('sc_basever_');

  // 검색 대상 목록 — 항목 추가는 여기만 수정
  const targets = [
    { re: /베이스\s*버전\s*설치/, label: '베이스버전 설치' },
    { re: /베이스\s*설치/,        label: '베이스 설치'     },
    { re: /적응\s*자료\s*설치/,   label: '적응자료 설치'   }
  ];

  const src = { ..._yearData, ..._monthData };
  const triggered = new Set();

  Object.values(src).forEach(row => {
    if (!row.memo || !row.memo.length) return;
    const base = new Date(row.date + 'T00:00:00');
    const d = base.getDate();
    const plus13 = fmtDate(new Date(base.getFullYear(), base.getMonth(), d + 13));
    const plus14 = fmtDate(new Date(base.getFullYear(), base.getMonth(), d + 14));
    if (TODAY !== plus13 && TODAY !== plus14) return;

    targets.forEach(({ re, label }) => {
      if (row.memo.some(line => re.test(line))) triggered.add(label);
    });
  });

  if (!triggered.size) return;
  localStorage.setItem(shownKey, '1');
  const sub = [...triggered].join(', ') + ' 기준 발송 기한입니다.';
  showAlertModal({ icon:'📄', heading:'알림문서 발송', title:'알림문서를 발송해 주세요.', sub, theme:'doc' });
}

// ── 메모 검색 ─────────────────────────────────────────────
function openSearch() {
  const overlay = document.getElementById('search-overlay');
  overlay.hidden = false;
  setTimeout(() => document.getElementById('search-input').focus(), 50);
  renderSearchResults('');
}
function closeSearch() {
  document.getElementById('search-overlay').hidden = true;
  document.getElementById('search-input').value = '';
}
function renderSearchResults(keyword) {
  const container = document.getElementById('search-results');
  const kw = keyword.trim().toLowerCase();
  if (!kw) {
    container.innerHTML = '<div class="search-empty" style="text-align:center;color:var(--g5);font-size:14px;padding:32px 16px;">검색어를 입력하세요</div>';
    return;
  }
  const src = { ..._yearData, ..._monthData };
  const matches = [];
  Object.values(src).forEach(row => {
    if (!row.memo || !row.memo.length) return;
    const matchedLines = row.memo.filter(line => line.toLowerCase().includes(kw));
    if (matchedLines.length) matches.push({ date: row.date, lines: matchedLines });
  });
  matches.sort((a, b) => b.date.localeCompare(a.date));
  if (!matches.length) {
    container.innerHTML = '<div class="search-empty" style="text-align:center;color:var(--g5);font-size:14px;padding:32px 16px;">검색 결과가 없습니다</div>';
    return;
  }
  const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const escapedHtmlKw = escH(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escapedHtmlKw})`, 'gi');
  container.innerHTML = matches.map(m => {
    const [y, mo, d] = m.date.split('-');
    const dt = new Date(m.date + 'T00:00:00');
    const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
    const dateLabel = `${y}년 ${Number(mo)}월 ${Number(d)}일 (${dow})`;
    const memoHtml = m.lines.map(line =>
      `<div class="search-result-memo">${escH(line).replace(re, '<mark>$1</mark>')}</div>`
    ).join('');
    return `<div class="search-result-item" data-date="${m.date}" data-y="${y}" data-m="${Number(mo)}">`
      + `<div class="search-result-date">${dateLabel}</div>${memoHtml}</div>`;
  }).join('');

  container.querySelectorAll('.search-result-item').forEach(el => {
    el.addEventListener('click', () => {
      const y = Number(el.dataset.y);
      const m = Number(el.dataset.m);
      if (curY !== y || curM !== m) {
        curY = y; curM = m;
        loadMonth(curY, curM).then(renderCalendar);
      }
      closeSearch();
    });
  });
}
document.getElementById('btn-search').addEventListener('click', openSearch);
document.getElementById('search-close-btn').addEventListener('click', closeSearch);
document.getElementById('search-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('search-overlay')) closeSearch();
});
document.getElementById('search-input').addEventListener('input', e => {
  renderSearchResults(e.target.value);
});

});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const alertWrap = document.getElementById('shared-alert-modal-wrap');
    if (alertWrap) { alertWrap.remove(); _alertQueue.length = 0; _alertShowing = false; return; }
    if (!document.getElementById('search-overlay').hidden) { closeSearch(); return; }
    closeSheet();
  }
  if (document.getElementById('screen-calendar').hidden) return;
  if (e.key === 'ArrowLeft')  goMonth(-1);
  if (e.key === 'ArrowRight') goMonth(1);
});
