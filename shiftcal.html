  <style>
/* ─── Reset & Variables ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none!important;}
:root{
  --pri:#2563eb;--pri-lt:#dbeafe;
  --red:#dc2626;--grn:#16a34a;
  /* 라이트 모드 — 밝은 글래스모피즘 */
  --bg-panel:#ffffff;
  --bg-cell:rgba(255,255,255,0.72);
  --bg-cell-other:rgba(255,255,255,0.42);
  --bg-header:rgba(255,255,255,0.75);
  --border:rgba(180,180,220,0.45);
  --text:#1f2937;--text-muted:#6b7280;--text-dim:#9ca3af;
  --g0:#ffffff;--g1:#f9fafb;--g2:rgba(243,244,246,0.8);--g3:#e5e7eb;
  --g4:rgba(140,150,200,0.65);--g5:#9ca3af;--g6:#6b7280;--g7:#374151;--g8:#1f2937;--g9:#111827;
  --holiday-bg:rgba(255,240,239,0.88);--holiday-text:#bf3f36;
  --weekend-bg:rgba(219,234,254,0.72);
  --my-shift-bg:rgba(219,234,254,0.82);
  --today-bg:rgba(219,234,254,0.96);
  --ticker-bg:rgba(240,247,255,0.85);--ticker-border:#cce0ff;--ticker-text:#1e40af;
  --r:12px;--sh:0 4px 24px rgba(0,0,0,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ─── 다크 모드 — 딥 글래스모피즘 ──────────────────────── */
body.dark{
  --bg-panel:rgba(20,20,40,0.95);
  --bg-cell:rgba(255,255,255,0.06);
  --bg-cell-other:rgba(255,255,255,0.03);
  --bg-header:rgba(10,10,26,0.82);
  --border:rgba(255,255,255,0.1);
  --text:#f0f0f0;--text-muted:#b0bac6;--text-dim:#6b7280;
  --g0:rgba(26,26,46,0.95);--g1:rgba(17,17,34,0.9);--g2:rgba(30,30,50,0.8);--g3:rgba(46,46,70,0.8);
  --g4:rgba(255,255,255,0.15);--g5:#6b7280;--g6:#9ca3af;--g7:#d1d5db;--g8:#e8e8e8;--g9:#f3f4f6;
  --holiday-bg:rgba(30,10,10,0.9);--holiday-text:#ff6b6b;
  --weekend-bg:rgba(14,14,30,0.8);
  --my-shift-bg:rgba(13,24,40,0.85);
  --today-bg:rgba(15,31,58,0.95);
  --pri:#3b82f6;--pri-lt:rgba(15,31,58,0.9);
  --ticker-bg:rgba(13,21,32,0.9);--ticker-border:#1e3050;--ticker-text:#7eb8f5;
}
html,body{height:100%;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;color:var(--text);min-height:100dvh;
  transition:color .2s;
}
/* 배경 그라디언트 — iOS Safari fixed 버그 우회: body::before 고정 레이어 */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg,#e8f0fe 0%,#f3e8ff 50%,#e0f2fe 100%);
  transition:background .3s;
}
body.dark::before{
  background:linear-gradient(135deg,#0a0a1a 0%,#0d0816 45%,#0a1020 100%);
}

/* ─── Form elements ─────────────────────────────────────── */
input,select,textarea{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--g3);border-radius:8px;
  font-size:15px;font-family:inherit;color:var(--g8);background:var(--g0);
  outline:none;transition:border-color .15s;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri);}
textarea{resize:vertical;min-height:72px;}

/* ─── Buttons ───────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 20px;border:none;border-radius:8px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:opacity .15s,transform .1s;min-height:48px;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--pri);color:#fff;}
.btn-secondary{background:var(--g2);color:var(--g7);}

/* ─── Login Screen ──────────────────────────────────────── */
#screen-login{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;gap:16px;
  background:#0a0a0a;
}
.login-card{
  background:#161616;border-radius:var(--r);
  border:1px solid #2a2a2a;
  box-shadow:0 8px 48px rgba(0,0,0,.7);
  padding:40px 28px;width:100%;max-width:360px;
  display:flex;flex-direction:column;gap:20px;
}
.login-brand{
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.login-icon{
  width:60px;height:60px;
  background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(37,99,235,.4);
}
.login-corp{
  font-size:11px;font-weight:500;color:#4b5563;
  letter-spacing:.12em;text-transform:uppercase;
}
.login-dept{
  font-size:14px;font-weight:600;color:#9ca3af;letter-spacing:.03em;
}
.login-title{font-size:22px;font-weight:700;color:#f9fafb;text-align:center;}
.login-sub{font-size:13px;color:var(--g5);text-align:center;margin-top:-12px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:13px;font-weight:500;color:var(--g6);}
.form-hint{font-size:12px;color:var(--g5);margin-top:4px;}
.error-msg{color:var(--red);font-size:13px;text-align:center;}
#screen-login .form-label{color:#6b7280;}
#screen-login .form-hint{color:#4b5563;}
#screen-login input{
  background:#222;border-color:#333;color:#f3f4f6;
}
#screen-login input:focus{border-color:#3b82f6;}
#screen-login input::placeholder{color:#4b5563;}
#screen-login .btn-primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 4px 16px rgba(37,99,235,.35);}
#screen-login .btn-secondary{background:#222;color:#9ca3af;border:1px solid #333;}

/* ─── Calendar Screen ───────────────────────────────────── */
#screen-calendar{
  display:flex;flex-direction:column;height:100dvh;
  max-width:800px;margin:0 auto;overflow:hidden;
  padding-bottom:var(--safe-b);
}

/* Header */
.cal-header{
  background:var(--bg-header);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:10px 12px;display:flex;align-items:center;gap:7px;
  position:sticky;top:0;z-index:10;flex-wrap:nowrap;
}
.cal-nav-btn,.cal-icon-btn{
  width:40px;height:40px;border:none;background:var(--g2);border-radius:8px;
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text);flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.cal-nav-btn:active,.cal-icon-btn:active{background:var(--g3);}
.cal-month-label{
  flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--text);
  white-space:nowrap;
}
.cal-today-btn{
  padding:7px 12px;border:none;background:var(--pri-lt);color:var(--pri);
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;
}


/* Notices */
#notices-banner{
  background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 14px;
}
.notice-line{
  font-size:13px;color:#92400e;padding:2px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* DOH bar */
#doh-bar{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:8px 12px;background:var(--bg-header);border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.doh-chip{padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.doh-pos{background:#dbeafe;color:#1e40af;}
.doh-neg{background:#fee2e2;color:var(--red);}
.doh-zero{background:var(--g2);color:var(--g5);}
body.dark .doh-pos{background:#0d1e30;color:#93c5fd;}
body.dark .doh-neg{background:#2a0a0a;color:#fca5a5;}
body.dark .doh-zero{background:var(--g2);color:var(--g5);}

/* 공지 티커 */
#ticker-wrap{
  background:var(--ticker-bg);border-bottom:1px solid var(--ticker-border);
  overflow:hidden;height:38px;display:flex;align-items:center;flex-shrink:0;
  position:relative;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,black 5%,black 95%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,black 5%,black 95%,transparent 100%);
  cursor:pointer;
}
.ticker-track{
  display:flex;white-space:nowrap;
  animation:ticker-scroll 30s linear infinite;
  padding-left:16px;
}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{
  display:inline-flex;align-items:center;padding:0 32px;
  font-size:14px;font-weight:700;color:var(--ticker-text);
}
.ticker-dot{
  width:7px;height:7px;background:var(--pri);border-radius:50%;
  margin-right:8px;flex-shrink:0;
}
@keyframes ticker-scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* 공지 관리 모달 */
#notice-modal{position:fixed;inset:0;z-index:400;}
#nm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
#nm-card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(380px,92vw);background:var(--bg-panel);border-radius:var(--r);
  box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;
}
#nm-header{
  padding:14px 16px;display:flex;align-items:center;
  border-bottom:1px solid var(--border);
}
#nm-title{flex:1;font-size:16px;font-weight:700;color:var(--text);}
#nm-close{
  width:28px;height:28px;border:none;background:var(--g2);
  border-radius:50%;font-size:14px;cursor:pointer;color:var(--text-muted);
}
#nm-list{
  max-height:260px;overflow-y:auto;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;
}
.nm-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;background:var(--g1);border-radius:8px;
}
.nm-text{flex:1;font-size:14px;color:var(--text);word-break:break-all;}
.nm-del{
  width:24px;height:24px;border:none;background:none;
  font-size:14px;color:var(--g5);cursor:pointer;flex-shrink:0;
}
.nm-del:active{color:var(--red);}
.nm-empty{text-align:center;color:var(--g5);font-size:14px;padding:16px 0;}
#nm-add-row{
  display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);
}
#nm-input{flex:1;padding:9px 12px;font-size:14px;}
#nm-add-btn{
  padding:9px 16px;background:var(--pri);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  white-space:nowrap;
}

/* 삭제 확인 모달 */
#del-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;}
#del-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);}
#del-card{
  position:relative;width:min(320px,88vw);background:var(--bg-panel);
  border-radius:var(--r);box-shadow:var(--sh);padding:24px 20px 16px;
  text-align:center;z-index:1;
}
#del-card .del-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
#del-card .del-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
#del-card .del-btns{display:flex;flex-direction:column;gap:8px;}
#del-card .del-btn{
  padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;transition:background .15s;
}
#del-card .del-btn.only{background:var(--pri);color:#fff;}
#del-card .del-btn.only:active{background:#1d4ed8;}
#del-card .del-btn.all{background:var(--red);color:#fff;}
#del-card .del-btn.all:active{background:#b91c1c;}
#del-card .del-btn.cancel{background:var(--g2);color:var(--text-muted);}
#del-card .del-btn.cancel:active{background:var(--g3);}
/* 변경 알림 모달 */
#changes-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;}
#changes-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);}
#changes-card{
  position:relative;width:min(360px,90vw);max-height:70vh;background:var(--bg-panel);
  border-radius:var(--r);box-shadow:var(--sh);z-index:1;display:flex;flex-direction:column;overflow:hidden;
}
#changes-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
#changes-title{flex:1;font-size:15px;font-weight:700;color:var(--text);}
#changes-count{font-size:12px;color:var(--pri);font-weight:700;margin-left:8px;}
#changes-list{overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
.chg-item{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--g1);border-radius:8px;}
.chg-date{font-size:13px;font-weight:700;color:var(--text);}
.chg-memo{font-size:12px;color:var(--text-muted);line-height:1.4;}
.chg-source{font-size:10px;color:var(--g5);margin-top:2px;}
#changes-ok{
  margin:12px 14px;padding:12px;background:var(--pri);color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
}

/* Day-of-week row — cal-grid gap에 맞춰 정렬 */
.cal-dow{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:1px;padding:3px 2px 0;
  background:transparent;
}
.dow-cell{
  text-align:center;padding:3px 0;
  font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--text);
}
.dow-cell:first-child{color:var(--holiday-text);}
.dow-cell:last-child{color:var(--pri);}

/* Calendar grid — 카드형 */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:1px;padding:1px 2px 4px;
  flex:1;min-height:0;grid-auto-rows:1fr;
}
.cal-day{
  border:1px solid var(--border);border-radius:6px;
  padding:3px 2px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--bg-cell);position:relative;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
  -webkit-tap-highlight-color:transparent;transition:background .15s,box-shadow .15s,border-color .15s;
}
.cal-day:active{background:var(--g2);border-color:var(--pri);box-shadow:0 0 0 2px var(--pri);}
.cal-day.other-month{background:var(--bg-cell-other);border-color:transparent;box-shadow:none;}
.cal-day.other-month .day-num{color:var(--text-dim);}
.cal-day.other-month .shift-badge{opacity:.35;}
/* 주말·공휴일 */
.cal-day.is-holiday{background:var(--holiday-bg)!important;}
.cal-day.is-sun .day-num,.cal-day.is-sun .shift-badge{color:var(--holiday-text)!important;}
.cal-day.is-sat .day-num{color:var(--pri);}
.cal-day.is-holiday .day-num{color:var(--holiday-text)!important;}
.cal-day.is-holiday .shift-badge{
  background:var(--holiday-bg)!important;color:var(--holiday-text)!important;border-color:var(--holiday-text)!important;
}
/* 오늘 */
.cal-day.is-today{background:var(--today-bg);border-color:var(--pri);border-width:2px;box-shadow:0 0 0 1px var(--pri);}
/* 내 조 근무일 강조 */
.cal-day.my-shift{background:var(--my-shift-bg);}
/* 다른 조 날짜 흐리게 */
.cal-day.dim-shift{pointer-events:none;}
.cal-day.dim-shift .day-num,
.cal-day.dim-shift .shift-badge,
.cal-day.dim-shift .memo-tag,
.cal-day.dim-shift .memo-more,
.cal-day.dim-shift .hol-name{opacity:.2;}

/* 셀: 날짜숫자 좌상단 + 교대뱃지 우측 */
.cal-day{align-items:flex-start!important;}
.cell-top{
  display:flex;align-items:center;justify-content:space-between;gap:2px;
  width:100%;
}
.day-num{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;border-radius:50%;flex-shrink:0;color:var(--g8);
}
.is-today .day-num{background:var(--pri);color:#fff!important;font-weight:700;}
.memo-dot{align-self:center;}

/* 교대조 뱃지 — 라이트 */
.shift-badge{
  font-size:9px;font-weight:700;padding:1px 5px;
  border-radius:20px;line-height:1.6;white-space:nowrap;
  background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc;
}
.shift-AB{background:#bbf7d0;color:#166534;border-color:#16a34a;}
.shift-BC{background:#bfdbfe;color:#1d4ed8;border-color:#3b82f6;}
.shift-CD{background:#fecaca;color:#b91c1c;border-color:#ef4444;}
.shift-DA{background:#fed7aa;color:#c2410c;border-color:#f97316;}
/* 비정규 교대조 (AB/BC/CD/DA 외) */
.shift-other{background:#f3e8ff;color:#7c3aed;border-color:#a78bfa;}
/* 24시간 근무 (AA/BB/CC/DD) */
.shift-24h{background:#4ade80;color:#14532d;border-color:#16a34a;}
.cal-day.is-24h{background:#bbf7d0!important;}
/* 교대조 뱃지 — 다크 */
body.dark .shift-AB{background:#0a1f12;color:#86efac;border-color:#1a5a30;}
body.dark .shift-BC{background:#0d1e30;color:#93c5fd;border-color:#2a5a8a;}
body.dark .shift-CD{background:#1e0808;color:#fca5a5;border-color:#7a1818;}
body.dark .shift-DA{background:#1e0e06;color:#fdba74;border-color:#7a3010;}
body.dark .shift-other{background:#1a0a2e;color:#c4b5fd;border-color:#5b21b6;}
body.dark .shift-24h{background:#052e16;color:#86efac;border-color:#166534;}
body.dark .cal-day.is-24h{background:#052e16!important;}
body.dark .cal-day{box-shadow:0 2px 8px rgba(0,0,0,0.3);}
body.dark .cal-day.other-month{box-shadow:none;}

.hol-name{
  width:100%;font-size:8px;font-weight:600;color:var(--holiday-text);
  padding:0 3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.memo-tag{
  width:100%;font-size:9px;font-weight:600;
  padding:1px 1px;border-radius:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.4;box-sizing:border-box;
}
/* 메모 태그 — 라이트 */
.mt-red  {background:#fee2e2;color:#b91c1c;}
.mt-blue {background:#dbeafe;color:#1d4ed8;}
.mt-green{background:#d1fae5;color:#065f46;}
.mt-gray {background:#f3f4f6;color:#374151;}
.mt-alert{background:#fef9c3;color:#a16207;font-weight:700;}
/* 메모 태그 — 다크 */
body.dark .mt-red  {background:rgba(220,38,38,0.22);color:#fca5a5;}
body.dark .mt-blue {background:rgba(37,99,235,0.22);color:#93c5fd;}
body.dark .mt-green{background:rgba(22,163,74,0.22);color:#86efac;}
body.dark .mt-gray {background:rgba(100,116,139,0.25);color:#cbd5e1;}
body.dark .mt-alert{background:rgba(202,138,4,0.22);color:#fde047;}
/* 달력 셀 알림 벨 */

'use strict';

/* ── Config ─────────────────────────────────────────────── */
const SB_URL = 'https://zonighcdnzdmsleltdmr.supabase.co';
const SB_KEY = 'sb_publishable_XvmpVyCxCq2Z2otbRKfWYw_9BGI39cV';

// 교대 ID → 조 매핑
const SHIFT_MAP      = { a:'A', b:'B', c:'C', d:'D' };
const DOH_WEEKEND_H  = 8;  // 주말 대체근무 보상시간
const DOH_NIGHTSHIFT_H = 11; // 교대야간 대체근무 보상시간

const TOKEN_KEY   = 'sc_token';
const REFRESH_KEY = 'sc_refresh';

/* ── Supabase REST helpers ──────────────────────────────── */
function getH() {
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + (_accessToken || SB_KEY),
    'Content-Type': 'application/json'
  };
}

function sbSignal(ms = 12000) {
  // AbortController 방식 — iOS 12.2+ 호환 (AbortSignal.timeout보다 넓은 지원)
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), ms);
  return ctrl.signal;
}

async function refreshToken() {
  const rt = localStorage.getItem(REFRESH_KEY);
  if (!rt) return false;
  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: rt }),
      signal: sbSignal(8000)
    });
    if (!res.ok) return false;
    const { access_token, refresh_token: newRt } = await res.json();
    _accessToken = access_token;
    localStorage.setItem(TOKEN_KEY, access_token);
    if (newRt) localStorage.setItem(REFRESH_KEY, newRt);
    return true;
  } catch { return false; }
}

async function sbGet(table, qs = '') {
  let r = await fetch(`${SB_URL}/rest/v1/${table}?${qs}`,
    { headers: getH(), signal: sbSignal() });
  if (r.status === 401) {
    const ok = await refreshToken();
    if (!ok) { doLogout(); throw new Error('세션 만료 — 다시 로그인해주세요'); }
    r = await fetch(`${SB_URL}/rest/v1/${table}?${qs}`,
      { headers: getH(), signal: sbSignal() });
  }
  if (!r.ok) throw new Error(`[${table}] ${r.status}: ${await r.text()}`);
  return r.json();
}

async function sbPost(table, body, prefer = 'return=minimal') {
  let r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST', headers: { ...getH(), 'Prefer': prefer },
    body: JSON.stringify(body), signal: sbSignal()
  });

async function doLogin(id, pw) {
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: SB_AUTH_EMAIL, password: pw }),
    signal: sbSignal()
  });
  if (!res.ok) throw new Error('비밀번호가 올바르지 않습니다');
  const { access_token, refresh_token } = await res.json();
  _accessToken = access_token;
  localStorage.setItem(TOKEN_KEY, access_token);
  if (refresh_token) localStorage.setItem(REFRESH_KEY, refresh_token);

  _authId = id.toLowerCase().trim();
  localStorage.setItem(AUTH_KEY, _authId || 'all');
  applyFilter();
}

function applyFilter() {
  const stored = localStorage.getItem(AUTH_KEY) || '';
  _authId     = (stored === 'all') ? '' : stored;
  _filterTeam = SHIFT_MAP[_authId] || null;
  _showAll    = !_filterTeam; // 교대 외 직원은 전체보기 기본
  // 드롭다운 초기값 동기화
  const sel = document.getElementById('filter-select');
  if (sel) sel.value = _filterTeam || 'ALL';
}

function isAuthed() {
  return !!localStorage.getItem(TOKEN_KEY) && !!localStorage.getItem(AUTH_KEY);
}

function doLogout() {
  localStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(REFRESH_KEY);
  _accessToken = null;
  _authId = null; _filterTeam = null; _showAll = false;
  showScreen('login');
}

/* ── Shift Calculation ──────────────────────────────────── */
const BASE_DATE = new Date('2025-06-02T00:00:00');
const SHIFTS    = ['AB', 'DA', 'CD', 'BC'];

function calcShift(dateStr) {
  const diff = Math.floor((new Date(dateStr + 'T00:00:00') - BASE_DATE) / 864e5);
  return SHIFTS[((diff % 4) + 4) % 4];
}

// 주어진 교대조 문자열이 특정 팀(A/B/C/D)의 근무일인지 확인
function isMyTeamDay(shift, team) {
  if (!team) return true;
  return shift.includes(team);
}

/* ── Date helpers ───────────────────────────────────────── */
const todayDt = new Date();
const TODAY   = fmtDate(todayDt);

// 이번 달 1일 (오늘 이전 달 메모 수정 불가 경계)
function thisMonthFirst() {
  const d = new Date(todayDt.getFullYear(), todayDt.getMonth(), 1);
  return fmtDate(d);
}

function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function isPastMonth(dateStr) {
  return dateStr < thisMonthFirst();
}
// YYYY-MM-DD → YY-MM-DD (대휴 표시용)
function shortDate(s) { return s && s.length >= 10 ? s.slice(2) : s; }
// YY-MM-DD → YYYY-MM-DD (복원용)
function fullDate(s) {
  if (!s) return s;
  if (/^\d{2}-\d{2}-\d{2}$/.test(s)) return '20' + s;
  return s;
}

function getDateRange(start, end, repeat, maxDays = 90) {
  const result = [];
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  if (s > e) return [start];
  const startDow = s.getDay();
  const startDate = s.getDate();
  const cur = new Date(s);
  while (cur <= e && result.length < maxDays) {
    let match = true;
    if (repeat === 'weekly') match = cur.getDay() === startDow;
    else if (repeat === 'monthly') match = cur.getDate() === startDate;
    if (match) result.push(fmtDate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  if (cur <= new Date(end + 'T00:00:00')) toast(`⚠️ 최대 ${maxDays}일까지만 저장됩니다 (일부 날짜 제외됨)`);
  return result;
}

function isShiftWorker(staffName, dateStr) {
  const s = _staff.find(r => r.name === staffName &&
    (!r.from_date || r.from_date <= dateStr) &&
    (!r.to_date || r.to_date >= dateStr));
  return s && /^[A-D]$/.test(s.shift);
}

async function loadMonth(y, m) {
  const first  = new Date(y, m-1, 1);
  const last   = new Date(y, m, 0);
  const gFrom  = fmtDate(new Date(y, m-1, 1 - first.getDay()));
  const trailDow = last.getDay();
  const gTo    = fmtDate(new Date(y, m, trailDow === 6 ? 0 : 6 - trailDow));

  const rows = await sbGet('shift_data',
    `date=gte.${gFrom}&date=lte.${gTo}&select=date,shift,memo,repeat_type`);
  _monthData = {};
  rows.forEach(r => { _monthData[r.date] = r; });
}

    `date=gte.${y}-01-01&date=lte.${y}-12-31&select=date,shift,memo`);
  _yearData = {};
  rows.forEach(r => { if (r.memo && r.memo.length) _yearData[r.date] = r; });
}

async function loadStaff() {

    'select=id,name,grade,shift,from_date,to_date&order=shift,name');

async function loadNotices() {
  const rows = await sbGet('notices',

async function loadCarry(y) {

  _carry = {};
  rows.forEach(r => { _carry[r.name] = Number(r.hours); });
}

/* ── DOH Calculation ─────────────────────────────────────── */
function calcDoh() {
  if (_dohCache) return _dohCache;
  const earned = {}, used = {};
  const src = { ..._yearData, ..._monthData };

  Object.values(src).forEach(row => {
    if (!Array.isArray(row.memo) || !row.memo.length) return;
    const shift = row.shift || calcShift(row.date);
    const dow   = new Date(row.date + 'T00:00:00').getDay();

    row.memo.forEach(line => {
      const mDae = line.match(/^대체:(.+)$/);
      if (mDae) {
        let h = 0;
        if (dow === 0 || dow === 6) h = DOH_WEEKEND_H;
        else if (/^[A-D]/.test(shift)) h = DOH_NIGHTSHIFT_H;
        if (h > 0) earned[mDae[1]] = (earned[mDae[1]] || 0) + h;
        return;
      }
      const mHu = line.match(/^대휴:([^(]+)/);
      if (mHu) used[mHu[1].trim()] = (used[mHu[1].trim()] || 0) + 8;
    });
  });

  const names = new Set([
    ...Object.keys(earned), ...Object.keys(used), ...Object.keys(_carry)
  ]);
  _dohCache = [...names]
    .map(n => ({
      name: n,
      rem: (_carry[n] || 0) + (earned[n] || 0) - (used[n] || 0)
    }))
    .sort((a, b) => b.rem - a.rem);
  return _dohCache;
}

/* ── Calendar Render ─────────────────────────────────────── */
function renderCalendar() {
  document.getElementById('month-label').textContent = `${curY}년 ${curM}월`;
  renderFilterBar();

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const first    = new Date(curY, curM-1, 1);
  const last     = new Date(curY, curM, 0);
  const startDow = first.getDay();

  for (let i = 0; i < startDow; i++) {
    const dt = new Date(curY, curM-1, 1 - (startDow - i));
    grid.appendChild(makeCell(dt, true));
  }
  for (let d = 1; d <= last.getDate(); d++) {
    grid.appendChild(makeCell(new Date(curY, curM-1, d), false));
  }
  const total    = startDow + last.getDate();
  const trailing = (7 - total % 7) % 7;
  for (let i = 1; i <= trailing; i++) {
    grid.appendChild(makeCell(new Date(curY, curM, i), true));
  }

  renderNotices();
  // renderDoh(); // 대휴시간 표시 제거
}

function renderFilterBar() {
  // 드롭다운 선택값과 동기화
  const sel = document.getElementById('filter-select');
  if (sel) sel.value = (_filterTeam && !_showAll) ? _filterTeam : 'ALL';
}

function makeCell(dt, other) {
  const dStr  = fmtDate(dt);
  const dow   = dt.getDay();
  const row   = _monthData[dStr] || {};
  const memos = row.memo || [];
  const shift = row.shift || calcShift(dStr);

  // 필터 모드에서 내 조 / 다른 조 판단
  const activeTeam = (!_showAll && _filterTeam) ? _filterTeam : null;
  const isMyTeam   = activeTeam ? isMyTeamDay(shift, activeTeam) : true;

  const cell = document.createElement('div');
  cell.className = 'cal-day' +
    (other     ? ' other-month' : '') +
    (dow === 0 ? ' is-sun'      : '') +
    (dow === 6 ? ' is-sat'      : '') +
    (dStr === TODAY ? ' is-today' : '') +
    (isHoliday(dt.getFullYear(), dt.getMonth()+1, dt.getDate()) ? ' is-holiday' : '') +
    (activeTeam && isMyTeam  && !other ? ' my-shift'  : '') +
    (activeTeam && !isMyTeam && !other ? ' dim-shift' : '');
  cell.dataset.date = dStr;

  const top = document.createElement('div');
  top.className = 'cell-top';

  const num = document.createElement('div');
  num.className   = 'day-num';
  num.textContent = dt.getDate();
  top.appendChild(num);

  // 다른 달 포함 모든 날짜에 교대뱃지 표시
  const NORMAL_SHIFTS = ['AB','BC','CD','DA'];
  const is24h = shift.length === 2 && shift[0] === shift[1] && /^[A-D]$/.test(shift[0]);
  const shiftCls = is24h ? 'shift-24h' : (NORMAL_SHIFTS.includes(shift) ? `shift-${shift}` : 'shift-other');
  if (is24h) cell.classList.add('is-24h');
  const badge       = document.createElement('div');
  badge.className   = `shift-badge ${shiftCls}`;
  badge.textContent = shift;
  top.appendChild(badge);
  cell.appendChild(top);

  // 공휴일 이름 표시 (이번 달만)
  if (!other) {
    const holName = getHolidayName(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
    if (holName) {
      const hn = document.createElement('div');
      hn.className = 'hol-name';
      hn.textContent = holName;
      cell.appendChild(hn);
    }
  }

  if (memos.length > 0 && !other) {
    // 알림 메모가 있으면 셀 상단에 🔔 표시
    if (memos.some(m => m.startsWith('알림:'))) {
      const bell = document.createElement('div');
      bell.className = 'cell-alert-bell';
      bell.textContent = '🔔';
      cell.style.position = 'relative';
      cell.appendChild(bell);
    }
    memos.slice(0, 4).forEach(line => {
      const tag = document.createElement('div');
      tag.className = 'memo-tag ' + getMemoTagClass(line);
      tag.textContent = getMemoTagText(line);
      cell.appendChild(tag);
    });
    if (memos.length > 4) {
      const more = document.createElement('div');
      more.className = 'memo-more';
      more.textContent = `+${memos.length - 4}`;
      cell.appendChild(more);
    }
  }

  cell.addEventListener('click', () => openSheet(dStr));
  return cell;
}

function getUpcomingMemos() {

    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const key = fmtDate(d);
    const entry = _monthData[key] || _yearData[key];
    const dayLabel = i === 0 ? '오늘' : i === 1 ? '내일' : `${d.getMonth()+1}/${d.getDate()}`;
    // 24시간 근무 감지 (AA, BB, CC, DD)
    const shift = entry?.shift || calcShift(key);
    if (shift.length === 2 && shift[0] === shift[1] && /^[A-D]$/.test(shift[0])) {
      items.push({ text: `[${dayLabel}] ${shift[0]}조 24시간 근무`, is24h: true });
    }
    if (!entry?.memo?.length) continue;
    entry.memo.forEach(line => {
      if (/^(연차|대체|대휴|교육|출장|기타):/.test(line)) {
        items.push({ text: `[${dayLabel}] ${fmtLine(line)}`, is24h: false });
      }
    });
  }
  return items;
}

function getDecemberDohWarnings() {
  if (new Date().getMonth() !== 11) return []; // 12월만
  const doh = calcDoh();
  const remaining = doh.filter(r => r.rem > 0);
  if (!remaining.length) return [];
  const names = remaining.map(r => `${escH(r.name)} ${r.rem}h`).join(', ');
  return [`<span class="ticker-item" style="color:#ef4444;font-weight:800"><span class="ticker-dot" style="background:#ef4444"></span>⚠️ 연말 대휴 미소진 — ${names} — 12월 말까지 소진하세요</span>`];
}

function renderNotices() {
  const wrap  = document.getElementById('ticker-wrap');
  const track = document.getElementById('ticker-track');
  wrap.hidden = false;

  // 공지 + 향후 일정 메모 + 12월 대휴 경고 합치기
  const noticeItems = _notices.map(n =>
    `<span class="ticker-item"><span class="ticker-dot"></span>${escH(n.text)}</span>`
  );
  const memoItems = getUpcomingMemos().map(m => {
    const color = m.is24h ? 'var(--red)' : 'var(--grn)';
    return `<span class="ticker-item" style="color:${color};${m.is24h?'font-weight:800':''}"><span class="ticker-dot" style="background:${color}"></span>${escH(m.text)}</span>`;
  }
  );
  const decItems = getDecemberDohWarnings();
  const allItems = [...decItems, ...noticeItems, ...memoItems];

  if (!allItems.length) {
    track.innerHTML = '<span class="ticker-item" style="color:var(--text-muted);font-weight:400">공지사항을 탭하여 추가하세요</span>';
    track.style.animation = 'none';
    return;
  }
  const html = allItems.join('');
  track.innerHTML = html + html; // 복제로 seamless 루프
  const speed = Math.max(12, allItems.length * 8);
  track.style.animationDuration = speed + 's';
  track.style.animation = '';
}

// 공지 추가 (Supabase)
async function addNotice(text, startDate, endDate) {
  if (!text.trim()) return;
  const body = { text:text.trim() };
  if (startDate) body.start_date = startDate;
  if (endDate) body.end_date = endDate;
  await sbPost('notices', body);
  await loadNotices();
  renderNotices();
}

// 공지 수정
async function updateNotice(id, text, startDate, endDate) {
  const body = { text:text.trim(), start_date: startDate || null, end_date: endDate || null };
  await sbPatch('notices', `id=eq.${id}`, body);
  await loadNotices();
  renderNotices();
}

// 공지 삭제 (soft-delete)
async function deleteNotice(id) {
  await sbPatch('notices', `id=eq.${id}`, { deleted_at: new Date().toISOString() });
  await loadNotices();
  renderNotices();
}

// 공지 관리 모달
let _editNoticeId = null;
function openNoticeModal() {
  const existing = document.getElementById('notice-modal');
  if (existing) { existing.remove(); return; }
  _editNoticeId = null;
  const modal = document.createElement('div');
  modal.id = 'notice-modal';
  modal.innerHTML = `
    <div id="nm-backdrop"></div>
    <div id="nm-card">
      <div id="nm-header">
        <span id="nm-title">공지사항 관리</span>
        <button id="nm-close">✕</button>
      </div>
      <div id="nm-list"></div>
      <div id="nm-add-form">
        <input type="text" id="nm-input" placeholder="공지 내용 입력..." maxlength="80">
        <div id="nm-date-row">
          <input type="date" id="nm-start" title="시작일" value="${TODAY}">
          <span>~</span>
          <input type="date" id="nm-end" title="종료일" value="${fmtDate(new Date(todayDt.getFullYear(), todayDt.getMonth(), todayDt.getDate() + 7))}">
        </div>
        <button id="nm-add-btn">추가</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  renderNoticeModal();
  const closeModal = () => { _editNoticeId = null; modal.remove(); };
  document.getElementById('nm-backdrop').onclick = closeModal;
  document.getElementById('nm-close').onclick    = closeModal;
  document.getElementById('nm-add-btn').onclick  = async () => {
    const inp = document.getElementById('nm-input');
    if (!inp.value.trim()) return;
    const sd = document.getElementById('nm-start').value || null;
    const ed = document.getElementById('nm-end').value || null;
    spinner(true);
    try {
      if (_editNoticeId) {
        await updateNotice(_editNoticeId, inp.value, sd, ed);
        _editNoticeId = null;
      } else {
        await addNotice(inp.value, sd, ed);
      }
      inp.value = '';
      document.getElementById('nm-start').value = '';
      document.getElementById('nm-end').value = '';
      document.getElementById('nm-add-btn').textContent = '추가';
      renderNoticeModal();
    }
    catch(e) { toast('공지 저장 실패'); }
    finally { spinner(false); }
  };
  document.getElementById('nm-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('nm-add-btn').click();
  });
}

function renderNoticeModal() {
  const list = document.getElementById('nm-list');
  if (!list) return;
  if (!_allNotices.length) {
    list.innerHTML = '<div class="nm-empty">등록된 공지사항이 없습니다.</div>';
    return;
  }
  list.innerHTML = _allNotices.map(n => {
    const dateInfo = (n.start_date || n.end_date)
      ? `<div class="nm-dates">${escH(n.start_date || '')} ~ ${escH(n.end_date || '')}</div>` : '';
    return `<div class="nm-item">
      <div class="nm-item-wrap">
        <span class="nm-text">${escH(n.text)}</span>
        ${dateInfo}
      </div>
      <button class="nm-edit" data-id="${escA(String(n.id))}" title="수정">✎</button>
      <button class="nm-del" data-id="${escA(String(n.id))}">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.nm-del').forEach(btn => {
    btn.onclick = async () => {
      spinner(true);
      try { await deleteNotice(+btn.dataset.id); renderNoticeModal(); }
      catch(e) { toast('공지 삭제 실패'); }
      finally { spinner(false); }
    };
  });
  list.querySelectorAll('.nm-edit').forEach(btn => {
    btn.onclick = () => {
      const n = _allNotices.find(x => x.id === +btn.dataset.id);
      if (!n) return;
      _editNoticeId = n.id;
      document.getElementById('nm-input').value = n.text;
      document.getElementById('nm-start').value = n.start_date || '';
      document.getElementById('nm-end').value = n.end_date || '';
      document.getElementById('nm-add-btn').textContent = '수정';
      document.getElementById('nm-input').focus();
    };
  });
}

function renderDoh() {
  const bar = document.getElementById('doh-bar');
  const doh = calcDoh();
  if (!doh.length) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = doh.map(d => {
    const cls  = d.rem > 0 ? 'doh-pos' : d.rem < 0 ? 'doh-neg' : 'doh-zero';
    const sign = d.rem > 0 ? '+' : '';
    return `<span class="doh-chip ${cls}">${escH(d.name)} ${sign}${d.rem}h</span>`;
  }).join('');
}

/* ── 변경사항 감지 & 알림 ─────────────────────────────────── */
async function checkChanges() {
  const lastSync = localStorage.getItem(SYNC_KEY);
  if (!lastSync) return [];
  try {
    const rows = await sbGet('shift_data',
      `updated_at=gt.${encodeURIComponent(lastSync)}&select=date,shift,memo,source,updated_at&order=updated_at.desc&limit=30`);
    return rows.filter(r => r.memo?.length || r.shift);
  } catch(e) { return []; }
}

function showChangesModal(changes) {
  const old = document.getElementById('changes-modal');
  if (old) old.remove();

  const DOW = ['일','월','화','수','목','금','토'];
  const srcLabel = { mobile:'모바일', desktop:'데스크탑', restore:'복구' };
  const maxShow = 20;
  const shown = changes.slice(0, maxShow);
  const extra = changes.length - maxShow;

  const items = shown.map(r => {
    const dt = new Date(r.date + 'T00:00:00');
    const dateStr = `${dt.getMonth()+1}/${dt.getDate()} (${DOW[dt.getDay()]})`;
    const memos = (r.memo || []).map(m => escH(fmtLine(m))).join(', ') || '(메모 없음)';

      <div class="chg-date">${dateStr}${r.shift ? ' ['+escH(r.shift)+']' : ''}</div>
      <div class="chg-memo">${memos}</div>
      <div class="chg-source">${src}</div>
    </div>`;
  }).join('');

  const modal = document.createElement('div');

    <div id="changes-backdrop"></div>
    <div id="changes-card">
      <div id="changes-header">
        <span id="changes-title">일정 변경사항</span>
        <span id="changes-count">${changes.length}건</span>
      </div>
      <div id="changes-list">
        ${items}
        ${extra > 0 ? `<div style="text-align:center;color:var(--g5);font-size:12px">+${extra}건 더</div>` : ''}
      </div>
      <button id="changes-ok">확인</button>
    </div>`;
  document.body.appendChild(modal);

  const close = () => {
    localStorage.setItem(SYNC_KEY, new Date().toISOString());
    modal.remove();
  };
  document.getElementById('changes-backdrop').onclick = close;
  document.getElementById('changes-ok').onclick = close;
}

/* ── Detail Sheet ─────────────────────────────────────────── */
let _curDate = null;
let _addOpen = false;
let _addType = '메모';
let _quickLeave = null; // { leaveName, subName } 확인 대기 상태

function openSheet(dStr) {
  _curDate = dStr;
  _addOpen = false;
  _addType = '메모';

  const dt  = new Date(dStr + 'T00:00:00');
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  document.getElementById('sheet-title').textContent =
    `${dt.getMonth()+1}월 ${dt.getDate()}일 (${dow})`;

  rebuildSheet();

  const bd = document.getElementById('sheet-backdrop');
  const sh = document.getElementById('detail-sheet');
  bd.hidden = false;
  sh.hidden = false;
  requestAnimationFrame(() => {
    bd.style.opacity = '1';
    sh.classList.add('open');
  });
}

function closeSheet() {
  const bd = document.getElementById('sheet-backdrop');
  const sh = document.getElementById('detail-sheet');
  bd.style.opacity = '0';
  sh.classList.remove('open');
  setTimeout(() => {
    bd.hidden = true;
    sh.hidden = true;
    _curDate    = null;
    _quickLeave = null;
  }, 300);
}

function rebuildSheet() {
  const body   = document.getElementById('sheet-body');
  const row    = _monthData[_curDate] || {};
  const shift  = row.shift || calcShift(_curDate);
  const memos  = row.memo || [];
  const isPast = isPastMonth(_curDate);

  // 교대조 편집 행
  const shiftBtns = ['AB','BC','CD','DA']
    .map(s => `<button class="shift-sel-btn shift-badge shift-${s}${shift===s?' sel-active':''}" data-shift="${s}">${s}</button>`)
    .join('');
  let html = `<div class="shift-row">
    <span style="flex-shrink:0">교대조</span>
    <div class="shift-sel-wrap">${shiftBtns}</div>
    ${isPast ? '' : `<input class="shift-custom-inp" id="shift-custom-inp" maxlength="4"
      placeholder="직접입력" value="${!['AB','BC','CD','DA'].includes(shift)?escH(shift):''}"
      style="text-transform:uppercase">`}
  </div>`;

  if (isPast) {
    html += `<div class="readonly-note">📌 지난 달 일정 — 읽기 전용</div>`;
  }

  // 알림 메모 상단 강조 배너
  const alertMemos = memos.filter(m => m.startsWith('알림:'));
  if (alertMemos.length) {
    html += `<div style="background:#fef9c3;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;margin-bottom:8px;">
      <div style="font-size:12px;font-weight:700;color:#a16207;margin-bottom:4px;">🔔 알림</div>
      ${alertMemos.map(m => `<div style="font-size:13px;color:#78350f;">${escH(m.replace(/^알림:/, ''))}</div>`).join('')}
    </div>`;
  }

  // Memo list
  html += `<div><div class="section-label" style="margin-bottom:8px">일정 메모</div>`;
  if (!memos.length) {
    html += `<div class="no-memo">등록된 일정이 없습니다</div>`;
  } else {
    html += `<div class="memo-list">`;
    memos.forEach((line, i) => {
      const type    = line.split(':')[0];
      const typeCls = ['연차','대체','대휴'].includes(type) ? `t-${type}` : '';
      const delBtn  = isPast ? '' :
        `<button class="memo-del" data-idx="${i}" aria-label="삭제">×</button>`;
      html += `<div class="memo-item ${typeCls}">
        <span class="memo-text">${escH(fmtLine(line))}</span>
        ${delBtn}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // Add form (과거 달은 표시 안 함)
  if (!isPast) html += buildAddForm();

  body.innerHTML = html;

  body.querySelectorAll('.memo-del').forEach(btn => {
    btn.addEventListener('click', () => onDelMemo(parseInt(btn.dataset.idx)));
  });

  // 교대조 버튼
  body.querySelectorAll('.shift-sel-btn').forEach(btn => {
    btn.addEventListener('click', () => onShiftChange(btn.dataset.shift));
  });
  const customInp = body.querySelector('#shift-custom-inp');
  customInp?.addEventListener('change', () => {
    const v = customInp.value.trim().toUpperCase();
    if (v) onShiftChange(v);
  });

  bindAddForm();
}

function getMemoTagText(line) {
  const m = line.match(/^(연차|대체|대휴|교육|출장|기타):(.+?)(\(.+\))?$/);
  if (m) {
    const name = m[2].trim();
    const t = {연차:'연차',대체:'대체',대휴:'대휴',교육:'교육',출장:'출장',기타:'기타'}[m[1]];
    return t + ':' + name;
  }
  return line;
}

function getMemoTagClass(line) {
  if (/^알림/.test(line))             return 'mt-alert';
  if (/^(연차|대휴|교육)/.test(line)) return 'mt-red';
  if (/^(대체|출장)/.test(line))      return 'mt-blue';
  if (/^기타/.test(line))             return 'mt-gray';
  return 'mt-green';
}

function fmtLine(line) {
  const [type, ...rest] = line.split(':');
  const labels = { '연차':'연차', '대체':'대체근무', '대휴':'대휴사용' };
  return labels[type] ? `${labels[type]}: ${rest.join(':')}` : line;
}

function buildAddForm() {
  if (!_addOpen) {
    return `<div class="add-card" id="add-card">
      <button class="add-open-btn" id="add-open-btn">＋ 일정 추가</button>
    </div>`;
  }

  // 연차+대체 확인 폼
  if (_quickLeave) {
    const tomorrow = new Date(_curDate + 'T00:00:00');
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = fmtDate(tomorrow);
    return `<div class="add-card active" id="add-card">
      <div class="section-label" style="margin-bottom:8px">연차+대체 확인</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div>
          <div style="font-size:11px;color:#888;margin-bottom:3px">연차 사용자</div>
          <select id="ql-leave" style="width:100%">${staffOpts(_curDate, { defaultName: _quickLeave.leaveName })}</select>
        </div>
        <div>
          <div style="font-size:11px;color:#888;margin-bottom:3px">대체 근무자</div>
          <select id="ql-sub" style="width:100%">${staffOpts(_curDate, { defaultName: _quickLeave.subName, sortDayFirst: true })}</select>
        </div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;padding:4px 0">
          <input type="checkbox" id="ql-dayoff-chk" checked style="width:18px;height:18px;cursor:pointer"> 대휴 추가
        </label>
        <input type="date" id="ql-dayoff-date" value="${tomorrowStr}" style="width:100%;font-size:14px;box-sizing:border-box">
      </div>
      <div class="add-actions">
        <button class="btn btn-secondary" id="ql-cancel">취소</button>
        <button class="btn btn-primary" id="ql-save">저장</button>
      </div>
    </div>`;
  }

  const types = ['메모','연차','대체','대휴','교육','출장','기타','알림'];
  // 로그인 팀의 첫 번째 직원 이름 (기본값)
  const myTeamDefault = _filterTeam
    ? (_staff.find(s => s.shift === _filterTeam &&
        (!s.from_date || s.from_date <= _curDate) &&
        (!s.to_date || s.to_date >= _curDate))?.name || '')
    : '';

  let f = `<div class="add-card active" id="add-card">
    <div class="type-tabs">
      ${types.map(t =>
        `<button class="type-tab${_addType===t?' active':''}" data-type="${t}">${t}</button>`
      ).join('')}
    </div>
    <div class="add-quick-btns">
      <button class="add-quick-btn" id="add-quick-leave">연차+대체</button>
    </div>`;

  if (_addType === '메모') {
    f += `<textarea id="add-input" placeholder="메모 내용 입력" rows="2"></textarea>`;
  } else if (_addType === '대휴') {
    f += `<select id="add-input">${staffOpts(_curDate, { defaultName: _lastSubName })}</select>
          <input type="date" id="add-ref" placeholder="원 대체일 (선택)" style="margin-top:4px">`;
  } else if (_addType === '대체') {
    f += `<select id="add-input">${staffOpts(_curDate, { sortDayFirst: true })}</select>`;
  } else if (_addType === '알림') {
    f += `<textarea id="add-input" placeholder="알림 내용 입력" rows="2" maxlength="100"></textarea>`;
  } else if (['교육','출장','기타'].includes(_addType)) {
    f += `<select id="add-input">${staffOpts(_curDate)}</select>
          <input type="text" id="add-ref" placeholder="${_addType}명/비고 (선택)" style="margin-top:4px">`;
  } else {
    f += `<select id="add-input">${staffOpts(_curDate, { defaultName: myTeamDefault })}</select>`;
  }

  // 기간 + 반복 옵션
  f += `<div class="add-range-row">
    <label><input type="checkbox" id="add-range-chk"> 기간 입력</label>
  </div>
  <div class="add-range-dates" id="add-range-dates">
    <input type="date" id="add-range-start" value="${_curDate}">
    <span class="add-range-sep">~</span>
    <input type="date" id="add-range-end" value="${_curDate}">
  </div>
  <div class="add-repeat-row" id="add-repeat-row">
    <label><input type="checkbox" id="add-repeat-chk"> 반복</label>
    <select class="add-repeat-sel" id="add-repeat-type">
      <option value="daily">매일</option>
      <option value="weekly">매주 (같은 요일)</option>
      <option value="monthly">매월 (같은 날짜)</option>
    </select>
  </div>`;

  f += `<div class="add-actions">
    <button class="btn btn-clear" id="add-clear">초기화</button>
    <button class="btn btn-secondary" id="add-cancel">취소</button>
    <button class="btn btn-primary"   id="add-save">저장</button>
  </div></div>`;
  return f;
}

function staffOpts(dateStr, opts = {}) {
  let active = _staff.filter(s =>
    (!s.from_date || s.from_date <= dateStr) &&
    (!s.to_date   || s.to_date   >= dateStr)
  );
  if (!active.length) return '<option value="">— 직원 없음 —</option>';
  if (opts.sortDayFirst) {
    // 대체용: 일근자(비교대) 우선
    active = [...active].sort((a,b) => {
      const ao = /^[A-D]$/.test(a.shift) ? 1 : 0;
      const bo = /^[A-D]$/.test(b.shift) ? 1 : 0;
      return ao - bo;
    });
  } else if (_filterTeam) {
    // 로그인 팀 우선 정렬
    active = [...active].sort((a,b) => {
      const ap = a.shift === _filterTeam ? 0 : 1;
      const bp = b.shift === _filterTeam ? 0 : 1;
      return ap - bp;
    });
  }
  const defaultVal = opts.defaultName || '';
  return '<option value="">— 직원 선택 —</option>' +
    active.map(s =>
      `<option value="${escA(s.name)}"${s.name === defaultVal ? ' selected' : ''}>${escH(s.name)} (${escH(s.shift)})</option>`
    ).join('');
}

function bindAddForm() {
  document.getElementById('add-open-btn')?.addEventListener('click', () => {
    _addOpen = true; rebuildSheet();
  });
  document.getElementById('add-cancel')?.addEventListener('click', () => {
    _addOpen = false; rebuildSheet();
  });
  document.querySelectorAll('.type-tab').forEach(tab => {
    tab.addEventListener('click', () => { _addType = tab.dataset.type; rebuildSheet(); });
  });
  document.getElementById('add-save')?.addEventListener('click', onSaveMemo);
  document.getElementById('add-clear')?.addEventListener('click', onClearMemo);
  // 기간 입력 토글 → 반복 행 표시/숨김 연동
  document.getElementById('add-range-chk')?.addEventListener('change', e => {
    const dates = document.getElementById('add-range-dates');
    const repeat = document.getElementById('add-repeat-row');
    if (dates) dates.classList.toggle('active', e.target.checked);
    if (repeat) {
      repeat.classList.toggle('active', e.target.checked);
      if (!e.target.checked) {
        const rchk = document.getElementById('add-repeat-chk');
        if (rchk) rchk.checked = false;
      }
    }
  });
  // 연차+대체 원클릭
  document.getElementById('add-quick-leave')?.addEventListener('click', onQuickLeave);
  // 연차+대체 확인 폼
  document.getElementById('ql-cancel')?.addEventListener('click', () => {
    _quickLeave = null; _addOpen = false; rebuildSheet();
  });
  document.getElementById('ql-save')?.addEventListener('click', onQuickLeaveSave);
  const qlChk  = document.getElementById('ql-dayoff-chk');
  const qlDate = document.getElementById('ql-dayoff-date');
  if (qlChk && qlDate) {
    qlDate.disabled = !qlChk.checked;
    qlDate.style.opacity = qlChk.checked ? '1' : '0.3';
    qlChk.addEventListener('change', () => {
      qlDate.disabled = !qlChk.checked;
      qlDate.style.opacity = qlChk.checked ? '1' : '0.3';
    });
  }
  const inp = document.getElementById('add-input');
  if (inp) setTimeout(() => inp.focus(), 60);
}

/* ── Memo CRUD ─────────────────────────────────────────────── */
// 야간 근무 팀 판별 (해당 날짜의 shift 코드 2번째 문자)
function getNightTeam(dateStr) {
  const shift = calcShift(dateStr); // 예: 'AB' → B가 야간
  return shift.length === 2 ? shift[1] : null;
}

// 연차+대체 원클릭
async function onQuickLeave() {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }

  const activeStaff = _staff.filter(s =>
    (!s.from_date || s.from_date <= _curDate) &&
    (!s.to_date || s.to_date >= _curDate));

  // ── 연차 기본값: 주중이면 야간 근무팀의 첫 번째 직원, 주말이면 로그인 팀 ──
  let leaveName = '';
  const dt = new Date(_curDate + 'T00:00:00');
  const dow = dt.getDay();
  const isWeekend = (dow === 0 || dow === 6);

  if (!isWeekend) {
    // 주중: 야간 근무 팀 직원이 기본
    const nightTeam = getNightTeam(_curDate);
    if (nightTeam) {
      const nightStaff = activeStaff.filter(s => s.shift === nightTeam || s.shift === nightTeam + '조');
      if (nightStaff.length) leaveName = nightStaff[0].name;
    }
  }
  // 주말이거나 야간 직원을 못 찾으면 로그인 팀 첫 직원
  if (!leaveName && _filterTeam) {
    const teamStaff = activeStaff.filter(s => s.shift === _filterTeam || s.shift === _filterTeam + '조');
    if (teamStaff.length) leaveName = teamStaff[0].name;
  }
  if (!leaveName) {
    _addType = '연차'; _addOpen = true; rebuildSheet();
    toast('직원을 선택하세요'); return;
  }

  // ── 대체 기본값: 현장일근 > 일근 > 사무실일근 순 (비교대 우선) ──
  let subName = '';
  const dayWorkers = activeStaff.filter(s => !/^[A-D](조)?$/.test(s.shift));
  // 현장일근 우선
  const fieldWorker = dayWorkers.find(s => /현장/.test(s.shift || s.grade || ''));
  subName = fieldWorker ? fieldWorker.name : (dayWorkers.length ? dayWorkers[0].name : '');

  // 바로 저장하지 않고 확인 폼 표시 (사용자가 수정 후 저장)
  _quickLeave = { leaveName, subName };
  _addOpen = true;
  rebuildSheet();
}

// 연차+대체 확인 폼에서 저장 실행
async function onQuickLeaveSave() {
  const leaveEl = document.getElementById('ql-leave');
  const subEl   = document.getElementById('ql-sub');
  const leaveName = leaveEl?.value || '';
  const subName   = subEl?.value   || '';
  if (!leaveName) { toast('연차 사용자를 선택하세요'); return; }

  spinner(true);
  try {
    const existing = _monthData[_curDate];
    const existMemo = existing?.memo || [];
    const newMemo = [...existMemo];

    // 연차 추가
    const leaveLine = `연차:${leaveName}`;
    if (!newMemo.includes(leaveLine)) newMemo.push(leaveLine);

    // 대체 추가
    if (subName) {
      const subLine = `대체:${subName}`;
      if (!newMemo.includes(subLine)) newMemo.push(subLine);
    }

    // 대휴 추가 — 체크된 경우만, 대체근무자 이름으로
    const dayOffChk  = document.getElementById('ql-dayoff-chk');
    const dayOffDate = document.getElementById('ql-dayoff-date');
    const addDayOff  = dayOffChk?.checked ?? true;
    const dayOffName = subName || leaveName;
    const dayOffStr  = dayOffDate?.value || '';

    if (addDayOff && dayOffStr) {
      const dayOffLine = `대휴:${dayOffName}(${shortDate(dayOffStr)})`;
      if (!newMemo.some(m => m.startsWith(`대휴:${dayOffName}`))) {
        newMemo.push(dayOffLine);
      }
    }

    await writeMemo(_curDate, newMemo, existing);
    updateLocalCache(_curDate, newMemo);

    // 대휴 크로스 저장 (지정 날짜에)
    if (addDayOff && dayOffStr) {
      try {
        let futureRow = _monthData[dayOffStr];
        if (!futureRow) {
          const rows = await sbGet('shift_data', `date=eq.${dayOffStr}&select=date,shift,memo`);
          futureRow = rows[0] || null;
        }
        const futureMemo = futureRow?.memo || [];
        const crossLine = `대휴:${dayOffName}(${shortDate(_curDate)})`;
        if (!futureMemo.includes(crossLine)) {
          await writeMemo(dayOffStr, [...futureMemo, crossLine], futureRow);
          if (_monthData[dayOffStr]) updateLocalCache(dayOffStr, [...futureMemo, crossLine]);
        }
      } catch(e) { toast('⚠️ 교차 저장 실패 — 상대 날짜를 직접 확인해주세요'); }
    }

    _quickLeave = null;
    _addOpen = false;
    rebuildSheet();
    renderCalendar();
    const info = `연차:${leaveName}` + (subName ? ` 대체:${subName}` : '');
    toast(`${info} 저장`);
  } catch(e) {
    toast('저장 실패: ' + e.message);
  } finally { spinner(false); }
}

// 기간/반복 범위 일괄 초기화 (메모 삭제, shift 유지)
async function onClearMemo() {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }
  const rangeChk = document.getElementById('add-range-chk');
  const repeatChk = document.getElementById('add-repeat-chk');
  const repeatType = (rangeChk?.checked && repeatChk?.checked)
    ? document.getElementById('add-repeat-type').value : null;
  const targetDates = (rangeChk?.checked)
    ? getDateRange(
        document.getElementById('add-range-start').value,
        document.getElementById('add-range-end').value,
        repeatType)
    : [_curDate];

  const msg = targetDates.length > 1
    ? `${targetDates.length}일의 메모를 모두 삭제하시겠습니까?`
    : '이 날의 메모를 모두 삭제하시겠습니까?';
  if (!confirm(msg)) return;

  spinner(true);
  try {
    // 범위 내 기존 데이터 조회
    const minD = targetDates[0], maxD = targetDates[targetDates.length - 1];
    const rangeRows = await sbGet('shift_data',
      `date=gte.${minD}&date=lte.${maxD}&select=date,shift,memo`);
    const dataMap = {};
    rangeRows.forEach(r => { dataMap[r.date] = r; });

    const now = new Date().toISOString();
    const toClear = targetDates.filter(d => dataMap[d]?.memo?.length);
    if (toClear.length) {
      // 범위 PATCH: 해당 날짜들 일괄 처리
      const dateList = toClear.map(d => `"${d}"`).join(',');
      await sbPatch('shift_data', `date=in.(${dateList})`, {
        memo: [], updated_at: now
      });
      toClear.forEach(d => updateLocalCache(d, []));
    }
    const cleared = toClear.length;

    rebuildSheet();
    renderCalendar();
    toast(cleared > 0 ? `${cleared}일 메모 초기화 완료` : '삭제할 메모가 없습니다');
  } catch(e) {
    toast('초기화 실패: ' + e.message);
  } finally { spinner(false); }
}

async function onSaveMemo() {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }

  const inp = document.getElementById('add-input');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) { toast('내용을 입력하세요'); return; }
  if (val.length > 200) { toast('200자를 초과할 수 없습니다'); return; }

  let line;
  if (_addType === '메모') {
    line = val;
  } else if (_addType === '대휴') {
    const ref = document.getElementById('add-ref')?.value;
    line = `대휴:${val}` + (ref ? `(${shortDate(ref)})` : '');
  } else if (['교육','출장','기타'].includes(_addType)) {
    const ref = document.getElementById('add-ref')?.value.trim();
    line = `${_addType}:${val}` + (ref ? `(${ref})` : '');
  } else {
    line = `${_addType}:${val}`;
  }

  const btn = document.getElementById('add-save');
  btn.disabled = true;
  spinner(true);
  try {
    // 기간 + 반복 입력 체크
    const rangeChk = document.getElementById('add-range-chk');
    const repeatChk = document.getElementById('add-repeat-chk');
    const repeatType = (rangeChk?.checked && repeatChk?.checked)
      ? document.getElementById('add-repeat-type').value : null;
    const targetDates = (rangeChk?.checked)
      ? getDateRange(
          document.getElementById('add-range-start').value,
          document.getElementById('add-range-end').value,
          repeatType)
      : [_curDate];

    // 기간 입력 시 범위 내 기존 데이터 일괄 조회
    let rangeDataMap = {};
    if (targetDates.length > 1) {
      const minD = targetDates[0], maxD = targetDates[targetDates.length - 1];
      const rangeRows = await sbGet('shift_data',
        `date=gte.${minD}&date=lte.${maxD}&select=date,shift,memo`);
      rangeRows.forEach(r => { rangeDataMap[r.date] = r; });
    }

    let savedCount = 0;
    const isAutoSubType = _addType === '연차' && val;
    for (const dateStr of targetDates) {
      if (isPastMonth(dateStr)) continue;
      const existing = targetDates.length > 1
        ? (rangeDataMap[dateStr] || null)
        : (_monthData[dateStr] || null);
      const existMemo = existing?.memo || [];
      if (existMemo.some(m => m.trim() === line.trim())) continue;

      const newMemo = [...existMemo, line];

      // 연차+대체 자동 추가: 교대근무자 연차 시 대체 자동 생성
      const autoSub = isAutoSubType && isShiftWorker(val, dateStr);
      if (autoSub) {
        const subLine = `대체:${val}`;
        if (!newMemo.includes(subLine)) newMemo.push(subLine);
      }

      await writeMemo(dateStr, newMemo, existing);
      updateLocalCache(dateStr, newMemo);
      savedCount++;
    }

    // 대체 이름 기억 (대휴 자동 연동용)
    if (_addType === '대체') _lastSubName = val;

    // 대휴 크로스 저장: 미래 날짜에도 자동 기록
    if (_addType === '대휴' && val) {
      const refDate = document.getElementById('add-ref')?.value;
      if (refDate && refDate > _curDate) {
        try {
          let futureRow = _monthData[refDate];
          if (!futureRow) {
            const rows = await sbGet('shift_data', `date=eq.${refDate}&select=date,shift,memo`);
            futureRow = rows[0] || null;
          }
          const futureMemo = futureRow?.memo || [];
          const crossLine = `대휴:${val}(${shortDate(_curDate)})`;
          if (!futureMemo.includes(crossLine)) {
            const newFutureMemo = [...futureMemo, crossLine];
            await writeMemo(refDate, newFutureMemo, futureRow);
            if (_monthData[refDate]) updateLocalCache(refDate, newFutureMemo);
          }
        } catch(e) { /* 크로스 저장 실패 무시 */ }
      }
    }

    _addOpen = false;
    rebuildSheet();
    renderCalendar();
    const subMsg = (isAutoSubType && savedCount) ? ' (대체 자동 추가)' : '';
    if (targetDates.length > 1) {
      toast(`${savedCount}일에 저장 완료${subMsg}`);
    } else {
      toast(`저장했습니다${subMsg}`);
    }
  } catch(e) {
    toast('저장 실패: ' + e.message);
    btn.disabled = false;
  } finally {
    spinner(false);
  }
}

async function onDelMemo(idx) {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }
  const row = _monthData[_curDate];
  if (!row?.memo) return;
  const line = row.memo[idx];

  // 같은 메모가 오늘 이후 다른 날짜에도 있는지 DB에서 확인
  spinner(true);
  let futureDates = [];
  try {
    const futureRows = await sbGet('shift_data',
      `date=gt.${_curDate}&memo=cs.{${JSON.stringify(line)}}&select=date&order=date`);
    futureDates = futureRows.map(r => r.date);
  } catch(e) {
    // 쿼리 실패 시 로컬 데이터로 폴백
    futureDates = Object.keys(_monthData).filter(d =>
      d > _curDate && _monthData[d]?.memo?.includes(line)
    );
  } finally {
    spinner(false);
  }

  if (futureDates.length > 0) {
    showDelModal(line, idx, futureDates);
  } else {
    if (!confirm('이 항목을 삭제하시겠습니까?')) return;
    spinner(true);
    try { await execDelMemo(idx, 'only'); }
    finally { spinner(false); }
  }
}

function showDelModal(line, idx, futureDates) {
  const old = document.getElementById('del-modal');
  if (old) old.remove();

  const displayLine = fmtLine(line);
  const cnt = futureDates.length;
  const modal = document.createElement('div');
  modal.id = 'del-modal';
  modal.innerHTML = `
    <div id="del-backdrop"></div>
    <div id="del-card">
      <div class="del-title">반복 일정 삭제</div>
      <div class="del-desc">
        "${escH(displayLine)}"<br>
        이 날 이후 <strong>${cnt}개</strong>의 같은 일정이 있습니다.
      </div>
      <div class="del-btns">
        <button class="del-btn only">이 날만 삭제</button>
        <button class="del-btn all">오늘부터 모두 삭제 (${cnt + 1}개)</button>
        <button class="del-btn cancel">취소</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const close = () => modal.remove();
  modal.querySelector('#del-backdrop').onclick = close;
  modal.querySelector('.del-btn.cancel').onclick = close;
  modal.querySelector('.del-btn.only').onclick = async () => {
    close();
    await execDelMemo(idx, 'only');
  };
  modal.querySelector('.del-btn.all').onclick = async () => {
    close();
    await execDelMemo(idx, 'all', futureDates);
  };
}

async function execDelMemo(idx, mode, futureDates) {
  const row = _monthData[_curDate];
  if (!row?.memo) return;
  const line = row.memo[idx];
  const newMemo = row.memo.filter((_, i) => i !== idx);
  spinner(true);
  try {
    // 현재 날짜 삭제
    await writeMemo(_curDate, newMemo, row);
    updateLocalCache(_curDate, newMemo);

    // 미래 날짜도 삭제
    if (mode === 'all' && futureDates?.length) {
      for (const d of futureDates) {
        let r = _monthData[d];
        if (!r) {
          // 현재 그리드 밖의 날짜 → DB에서 조회
          const rows = await sbGet('shift_data', `date=eq.${d}&select=date,shift,memo`);
          r = rows[0];
        }
        if (!r?.memo) continue;
        const updated = r.memo.filter(m => m !== line);
        await writeMemo(d, updated, r);
        if (_monthData[d]) updateLocalCache(d, updated);
      }
      toast(`${futureDates.length + 1}개 삭제했습니다`);
    } else {
      toast('삭제했습니다');
    }
    rebuildSheet();
    renderCalendar();
  } catch(e) {
    toast('삭제 실패: ' + e.message);
  } finally {
    spinner(false);
  }
}

// shift 값 보존, source='mobile' 으로 저장
async function writeMemo(dateStr, newMemo, existingRow) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) throw new Error('잘못된 날짜 형식');
  const now = new Date().toISOString();
  if (existingRow) {
    await sbPatch('shift_data', `date=eq.${dateStr}`, {
      memo: newMemo, source: 'mobile', updated_at: now
    });
  } else {
    await sbPost('shift_data', {
      date: dateStr, shift: null, memo: newMemo, source: 'mobile', updated_at: now
    }, 'resolution=merge-duplicates,return=minimal');
  }
}

async function onShiftChange(newShift) {
  if (isPastMonth(_curDate)) { toast('지난 달은 수정할 수 없습니다'); return; }
  if (!newShift) return;
  newShift = newShift.toUpperCase();
  if (!/^[A-Z]{1,4}$/.test(newShift)) { toast('교대조는 영문 1~4자만 가능합니다'); return; }
  const now = new Date().toISOString();
  try {
    const existing = _monthData[_curDate];
    if (existing) {
      await sbPatch('shift_data', `date=eq.${_curDate}`, { shift: newShift, updated_at: now });
    } else {
      await sbPost('shift_data',
        { date: _curDate, shift: newShift, memo: [], source: 'mobile', updated_at: now },
        'resolution=merge-duplicates,return=minimal');
    }
    if (!_monthData[_curDate]) _monthData[_curDate] = { date: _curDate, shift: null, memo: [] };
    _monthData[_curDate].shift = newShift;
    rebuildSheet();
    renderCalendar();
    toast(`교대조 → ${newShift}`);
  } catch(e) { toast('저장 실패: ' + e.message); }
}

/* ── JSON 다운로드 (현재 달~미래만 반출) ───────────────────── */
async function downloadJson() {
  spinner(true);
  try {
    const cutoff = thisMonthFirst();
    const rows = await sbGet('shift_data',
      `date=gte.${cutoff}&select=date,shift,memo,repeat_type&order=date`);
    const out = {};
    rows.forEach(r => {
      if (r.shift || (r.memo && r.memo.length) || r.repeat_type) {
        out[r.date] = {};
        if (r.shift) out[r.date].shift = r.shift;
        if (r.memo && r.memo.length) out[r.date].memo = r.memo;
        if (r.repeat_type) out[r.date].repeat = r.repeat_type;
      }
    });
    const count = Object.keys(out).length;
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `shiftcal_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(`내보내기 완료: ${cutoff} ~ 미래 ${count}건`);
  } catch(e) { toast('다운로드 실패: ' + e.message); }
  finally { spinner(false); }
}

/* ── 백업 복구 (현재 달~미래: 기존 삭제 → 새 데이터 삽입, 실패 시 롤백) ── */
async function uploadJson(file) {
  if (!file) return;
  const cutoff = thisMonthFirst(); // 이번 달 1일

  spinner(true);
  try {
    const text = await file.text();
    const data = JSON.parse(text);

    // ── 형식 감지 ──
    let dateEntries = {};
    let staffSync = false, noticeSync = false, carrySync = false;

    if (data.staff && typeof data.staff === 'object' && !Array.isArray(data.staff)) {
      dateEntries = data.staff;
      staffSync = true;
      if (data.noticeData) noticeSync = true;
      if (data.carryOver) carrySync = true;
    } else if (data.cal) {
      dateEntries = data.cal;
    } else {
      dateEntries = data;
    }

    // ── 날짜 분류 ──
    const allDates = Object.keys(dateEntries).filter(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
      const dt = new Date(d + 'T00:00:00');
      return !isNaN(dt) && fmtDate(dt) === d; // 존재하는 날짜인지 확인 (2025-13-45 등 차단)
    });
    const fileDates = allDates.filter(d => d >= cutoff);
    const skippedCount = allDates.length - fileDates.length;

    if (!fileDates.length && !noticeSync && !carrySync) {
      toast('현재 달 이후 복구할 데이터가 없습니다');
      return;
    }

    // ── Step 1: 기존 데이터 백업 (롤백용) ──
    const backup = await sbGet('shift_data',
      `date=gte.${cutoff}&select=date,shift,memo,repeat_type,source,updated_at`);

    let upsertCount = 0;
    try {
      // ── Step 2: 현재 달~미래 기존 데이터 전부 삭제 ──
      if (backup.length) {
        await sbDelete('shift_data', `date=gte.${cutoff}`);
      }

      // ── Step 3: 새 데이터 삽입 ──
      const insertRows = [];
      const now = new Date().toISOString();

      for (const date of fileDates) {
        const val = dateEntries[date];
        const fileMemo = Array.isArray(val.memo) ? val.memo : [];
        const fileShift = val.shift || null;
        const fileRepeat = val.repeat || val.repeat_type || null;
        if (fileMemo.length || fileShift) {
          // 메모 중복 제거
          const uniqueMemo = [...new Set(fileMemo)];
          insertRows.push({
            date, shift: fileShift, memo: uniqueMemo,
            repeat_type: fileRepeat, source: 'restore', updated_at: now
          });
        }
      }

      // 100건씩 INSERT
      for (let i = 0; i < insertRows.length; i += 100) {
        await sbPost('shift_data', insertRows.slice(i, i + 100),
          'resolution=merge-duplicates,return=minimal');
      }
      upsertCount = insertRows.length;

    } catch (restoreErr) {
      // ── 롤백: 백업 데이터 복원 ──
      toast('복구 중 오류 발생, 롤백 중...');
      try {
        // 실패한 데이터 정리
        await sbDelete('shift_data', `date=gte.${cutoff}`);
        // 백업 데이터 복원
        if (backup.length) {
          for (let i = 0; i < backup.length; i += 100) {
            await sbPost('shift_data', backup.slice(i, i + 100),
              'resolution=merge-duplicates,return=minimal');
          }
        }
        toast('롤백 완료 — 기존 데이터가 복원되었습니다');
      } catch (rollbackErr) {
        toast('롤백 실패! 내보내기 파일로 수동 복구 필요');
      }
      // 롤백 후 화면 갱신
      await Promise.all([loadMonth(curY, curM), loadYearData(curY)]);
      renderCalendar();
      return;
    }

    // ── 공지 → Supabase notices 동기화 ──
    let noticeCount = 0;
    if (noticeSync && data.noticeData?.notices) {
      const existing = await sbGet('notices', 'deleted_at=is.null&select=text');
      const existTexts = new Set(existing.map(n => n.text));
      for (const n of data.noticeData.notices) {
        if (n.text && !existTexts.has(n.text)) {
          await sbPost('notices', {
            text: n.text,
            start_date: n.start || null,
            end_date: n.end || null
          }, 'return=minimal');
          noticeCount++;
        }
      }
    }

    // ── 이월시간 → Supabase carry_over 동기화 ──
    let carryCount = 0;
    if (carrySync && data.carryOver) {
      const year = new Date().getFullYear();
      for (const [name, hours] of Object.entries(data.carryOver)) {
        if (typeof hours === 'number') {
          await sbPost('carry_over',
            { year, name, hours },
            'resolution=merge-duplicates,return=minimal');
          carryCount++;
        }
      }
    }

    await Promise.all([loadMonth(curY, curM), loadYearData(curY), loadCarry(curY), loadNotices()]);
    renderCalendar();

    // ── 결과 안내 ──
    const range = `${cutoff} ~ 미래`;
    const parts = [];
    if (backup.length) parts.push(`기존 ${backup.length}건 삭제`);
    if (upsertCount) parts.push(`신규 ${upsertCount}건 반영`);
    if (noticeCount) parts.push(`공지 ${noticeCount}건`);
    if (carryCount) parts.push(`이월 ${carryCount}건`);
    toast(`복구 완료 (${range}): ${parts.join(', ')}`);
    if (skippedCount) {
      setTimeout(() => toast(`※ 지난 달 일정 ${skippedCount}건은 동기화 제외`), 3000);
    }

    // 동기화 파일 내보내기
    syncExportJson();

  } catch(e) { toast('복구 실패: ' + e.message); }
  finally { spinner(false); }
}

/* ── 복구 후 shiftCalendar_data.json 동기화 내보내기 ────── */
async function syncExportJson() {
  try {
    const rows = await sbGet('shift_data', 'select=date,shift,memo,repeat_type&order=date');
    const out = {};
    rows.forEach(r => {
      if (r.shift || (r.memo && r.memo.length) || r.repeat_type) {
        out[r.date] = {};
        if (r.shift) out[r.date].shift = r.shift;
        if (r.memo && r.memo.length) out[r.date].memo = r.memo;
        if (r.repeat_type) out[r.date].repeat = r.repeat_type;
      }
    });
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `shiftCalendar_data.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('동기화 파일(shiftCalendar_data.json) 저장됨');
  } catch(e) { /* 동기화 내보내기 실패는 무시 */ }
}

function updateLocalCache(dateStr, newMemo) {
  _dohCache = null;
  if (!_monthData[dateStr]) _monthData[dateStr] = { date: dateStr, shift: null, memo: [] };
  _monthData[dateStr].memo = newMemo;
  if (newMemo.length) {
    if (_yearData[dateStr]) _yearData[dateStr].memo = newMemo;
    else _yearData[dateStr] = { date: dateStr, memo: newMemo };
  } else {
    delete _yearData[dateStr]; // 메모 전체 삭제 시 yearData에서도 제거
  }
}

/* ── Touch Swipe to Close ────────────────────────────────── */
let _swipeInited = false;
let _monthLoading = false;
function initSwipe() {
  if (_swipeInited) return;
  _swipeInited = true;
  // ── 달력 좌우 스와이프 → 월 이동 ────────────────────────
  // 모바일: touchstart/touchmove/touchend (passive:false로 수평 시 preventDefault)
  // 데스크탑: mousedown/mouseup
  const grid = document.getElementById('screen-calendar');

  function isSheetOpen() {
    return !document.getElementById('detail-sheet').hidden;
  }

  // 터치 (모바일)
  let tx = 0, ty = 0, tactive = false, locked = false;
  grid.addEventListener('touchstart', e => {
    if (isSheetOpen()) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    tactive = true; locked = false;
  }, { passive: true });

  grid.addEventListener('touchmove', e => {
    if (!tactive) return;
    const dx = e.touches[0].clientX - tx;
    const dy = e.touches[0].clientY - ty;
    if (!locked) {
      // 첫 move에서 방향 확정
      if (Math.abs(dx) > Math.abs(dy)) {
        locked = true;
        e.preventDefault(); // 수평 스크롤/뒤로가기 방지
      } else {
        tactive = false; // 수직 스크롤 — 스와이프 취소
      }
    }
  }, { passive: false });

  grid.addEventListener('touchend', e => {
    if (!tactive || !locked) { tactive = false; return; }
    tactive = false;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) {
      e.preventDefault(); // mouseup 발생 차단
      goMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: false });

  // 마우스 (데스크탑/Safari 트랙패드)
  let mx = 0, my = 0, mdown = false;
  grid.addEventListener('mousedown', e => {
    if (isSheetOpen()) return;
    mx = e.clientX; my = e.clientY; mdown = true;
  });
  grid.addEventListener('mouseup', e => {
    if (!mdown) return;
    mdown = false;
    if (isSheetOpen()) return;
    const dx = e.clientX - mx;
    const dy = e.clientY - my;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      goMonth(dx < 0 ? 1 : -1);
    }
  });
  grid.addEventListener('mouseleave', () => { mdown = false; });

  // ── 바텀시트 핸들 드래그로 닫기 ──────────────────────────
  if (window.innerWidth >= 600) return;
  const sh   = document.getElementById('detail-sheet');
  const hand = document.getElementById('sheet-handle');
  let sy = 0, cy = 0;

  hand.addEventListener('touchstart', e => {
    sy = e.touches[0].clientY; cy = 0; sh.style.transition = 'none';
  }, { passive: true });
  hand.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - sy;
    if (dy < 0) return;
    cy = dy; sh.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  hand.addEventListener('touchend', () => {
    sh.style.transition = '';
    if (cy > 100) closeSheet(); else sh.style.transform = 'translateY(0)';
  });
}

/* ── Utilities ───────────────────────────────────────────── */
function escH(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function spinner(on) { document.getElementById('page-spinner').hidden = !on; }
function showScreen(n) {
  document.getElementById('screen-login').hidden    = n !== 'login';
  document.getElementById('screen-calendar').hidden = n !== 'calendar';
}

/* ── Month Navigation ────────────────────────────────────── */
async function goMonth(delta) {
  if (_monthLoading) return;
  _monthLoading = true;
  curM += delta;
  if (curM > 12) { curM = 1; curY++; }
  if (curM < 1)  { curM = 12; curY--; }
  spinner(true);
  try { await loadMonth(curY, curM); renderCalendar(); }
  catch(e) { toast('로드 실패: ' + e.message); }
  finally  { spinner(false); _monthLoading = false; }
}

/* ── Full Init ───────────────────────────────────────────── */
async function initApp() {
  curY = todayDt.getFullYear();
  curM = todayDt.getMonth() + 1;
  showScreen('calendar');
  spinner(true);
  try {
    await Promise.all([
      loadMonth(curY, curM),
      loadYearData(curY),
      loadStaff(),
      loadNotices(),
      loadCarry(curY)
    ]);
  } catch(e) {
    console.error('Supabase 로드 실패:', e);
    if (e.message === '세션 만료') return; // doLogout()이 이미 로그인 화면으로 전환
    // 연결 실패 시에도 달력은 표시 (계산된 교대조로 표시)
    toast('서버 연결 실패 — 오프라인 모드로 표시합니다');
  } finally {
    spinner(false);
  }
  // 데이터 유무 관계없이 달력 렌더 + 스와이프 초기화
  renderCalendar();
  initSwipe();
  checkMemoAlerts();
  checkSafetyAlert();
  checkBaseVersionAlert();

  // 변경사항 감지 (최초 접속 시 lastSync 초기화)
  if (!localStorage.getItem(SYNC_KEY)) {
    localStorage.setItem(SYNC_KEY, new Date().toISOString());
  } else {
    try {
      const changes = await checkChanges();
      if (changes.length) showChangesModal(changes);
    } catch(e) { /* ignore */ }
  }
}
