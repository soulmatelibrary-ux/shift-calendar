<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>교대근무 일정표</title>

  <!-- PWA / iPhone 홈화면 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="교대일정">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <meta name="theme-color" content="#2563eb">

  <style>
/* ─── Reset & Variables ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none!important;}
:root{
  --pri:#2563eb;--pri-lt:#dbeafe;
  --red:#dc2626;--grn:#16a34a;
  --g0:#ffffff;--g1:#f9fafb;--g2:#f3f4f6;--g3:#e5e7eb;
  --g4:#d1d5db;--g5:#9ca3af;--g6:#6b7280;--g7:#374151;--g8:#1f2937;--g9:#111827;
  --holiday-bg:#fff6f5;--holiday-text:#bf3f36;
  --weekend-bg:#fafcff;
  --r:12px;--sh:0 4px 24px rgba(0,0,0,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;color:var(--g8);background:var(--g1);min-height:100dvh;
}

/* ─── Form elements ─────────────────────────────────────── */
input,select,textarea{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--g3);border-radius:8px;
  font-size:15px;font-family:inherit;color:var(--g8);background:var(--g0);
  outline:none;transition:border-color .15s;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri);}
textarea{resize:vertical;min-height:72px;}

/* ─── Buttons ───────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 20px;border:none;border-radius:8px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:opacity .15s,transform .1s;min-height:48px;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--pri);color:#fff;}
.btn-secondary{background:var(--g2);color:var(--g7);}

/* ─── Login Screen ──────────────────────────────────────── */
#screen-login{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;gap:16px;
  background:#0a0a0a;
}
.login-card{
  background:#161616;border-radius:var(--r);
  border:1px solid #2a2a2a;
  box-shadow:0 8px 48px rgba(0,0,0,.7);
  padding:40px 28px;width:100%;max-width:360px;
  display:flex;flex-direction:column;gap:20px;
}
.login-brand{
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.login-icon{
  width:60px;height:60px;
  background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(37,99,235,.4);
}
.login-corp{
  font-size:11px;font-weight:500;color:#4b5563;
  letter-spacing:.12em;text-transform:uppercase;
}
.login-dept{
  font-size:14px;font-weight:600;color:#9ca3af;letter-spacing:.03em;
}
.login-title{font-size:22px;font-weight:700;color:#f9fafb;text-align:center;}
.login-sub{font-size:13px;color:var(--g5);text-align:center;margin-top:-12px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:13px;font-weight:500;color:var(--g6);}
.form-hint{font-size:12px;color:var(--g5);margin-top:4px;}
.error-msg{color:var(--red);font-size:13px;text-align:center;}
#screen-login .form-label{color:#6b7280;}
#screen-login .form-hint{color:#4b5563;}
#screen-login input{
  background:#222;border-color:#333;color:#f3f4f6;
}
#screen-login input:focus{border-color:#3b82f6;}
#screen-login input::placeholder{color:#4b5563;}
#screen-login .btn-primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 4px 16px rgba(37,99,235,.35);}
#screen-login .btn-secondary{background:#222;color:#9ca3af;border:1px solid #333;}

/* ─── Calendar Screen ───────────────────────────────────── */
#screen-calendar{
  display:flex;flex-direction:column;height:100dvh;
  max-width:800px;margin:0 auto;overflow:hidden;
  padding-bottom:var(--safe-b);
}

/* Header */
.cal-header{
  background:var(--g0);border-bottom:1px solid var(--g3);
  padding:10px 12px;display:flex;align-items:center;gap:7px;
  position:sticky;top:0;z-index:10;flex-wrap:nowrap;
}
.cal-nav-btn,.cal-icon-btn{
  width:40px;height:40px;border:none;background:var(--g2);border-radius:8px;
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--g7);flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.cal-nav-btn:active,.cal-icon-btn:active{background:var(--g3);}
.cal-month-label{
  flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--g9);
  white-space:nowrap;
}
.cal-today-btn{
  padding:7px 12px;border:none;background:var(--pri-lt);color:var(--pri);
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;
}

/* Sub header (filter bar) */
.cal-subheader{
  background:var(--g0);border-bottom:1px solid var(--g3);
  padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.filter-label{font-size:13px;color:var(--g6);}
.filter-badge{
  display:inline-flex;align-items:center;
  padding:4px 12px;border-radius:20px;
  font-size:13px;font-weight:700;
  background:#e0e7ff;color:#3730a3;
}
.all-view-btn{
  margin-left:auto;padding:5px 12px;border:none;
  background:var(--g2);color:var(--g6);border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.all-view-btn.active{background:var(--pri-lt);color:var(--pri);}

/* Notices */
#notices-banner{
  background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 14px;
}
.notice-line{
  font-size:13px;color:#92400e;padding:2px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* DOH bar */
#doh-bar{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:8px 12px;background:var(--g0);border-bottom:1px solid var(--g3);
}
.doh-chip{padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.doh-pos{background:#dbeafe;color:#1e40af;}
.doh-neg{background:#fee2e2;color:var(--red);}
.doh-zero{background:var(--g2);color:var(--g5);}

/* Day-of-week row */
.cal-dow{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--g1);border-bottom:1px solid var(--g3);
}
.dow-cell{
  text-align:center;padding:7px 0;
  font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--g5);
}
.dow-cell:first-child{color:var(--red);}
.dow-cell:last-child{color:var(--pri);}

/* Calendar grid — 화면 꽉 채우기 */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  border-left:1px solid var(--g3);
  flex:1;min-height:0;grid-auto-rows:1fr;
}
.cal-day{
  border-right:1px solid var(--g3);border-bottom:1px solid var(--g3);
  padding:4px 2px 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--g0);position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;transition:background .1s;
}
.cal-day:active{background:var(--g2);}
.cal-day.other-month{background:var(--g1);}
.cal-day.other-month .day-num{color:var(--g4);}
.cal-day.other-month .shift-badge{opacity:.25;}
/* 주말·공휴일 */
.cal-day.is-sat{background:var(--weekend-bg);}
.cal-day.is-sun{background:var(--weekend-bg);}
.cal-day.is-holiday{background:var(--holiday-bg)!important;}
.cal-day.is-sun .day-num,.cal-day.is-sun .shift-badge{color:var(--holiday-text)!important;}
.cal-day.is-sat .day-num{color:var(--pri);}
.cal-day.is-holiday .day-num{color:var(--holiday-text)!important;}
.cal-day.is-holiday .shift-badge{
  background:#ffe4e1!important;color:var(--holiday-text)!important;border-color:#fca5a5!important;
}
/* 오늘 */
.cal-day.is-today{background:#eff6ff;box-shadow:inset 0 0 0 1.5px var(--pri);}
/* 내 조 근무일 강조 */
.cal-day.my-shift{background:#f0fdf4;}
/* 다른 조 날짜 흐리게 (필터 모드) */
.cal-day.dim-shift .day-num{color:var(--g4)!important;}
.cal-day.dim-shift .shift-badge{opacity:.28;}
.cal-day.dim-shift .memo-dot{opacity:.2;}

/* 셀: 날짜숫자 좌상단 + 교대뱃지 우측 */
.cal-day{align-items:flex-start!important;}
.cell-top{
  display:flex;align-items:center;justify-content:space-between;gap:2px;
  width:100%;
}
.day-num{
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;border-radius:50%;flex-shrink:0;color:var(--g8);
}
.is-today .day-num{background:var(--pri);color:#fff!important;font-weight:700;}
.memo-dot{align-self:center;}

/* 교대조 뱃지 — 원본과 동일한 색상 */
.shift-badge{
  font-size:9px;font-weight:700;padding:1px 4px;
  border-radius:4px;line-height:1.6;white-space:nowrap;
  background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc;
}
.shift-AB{background:#bbf7d0;color:#166534;border-color:#16a34a;}
.shift-BC{background:#bfdbfe;color:#1d4ed8;border-color:#3b82f6;}
.shift-CD{background:#fecaca;color:#b91c1c;border-color:#ef4444;}
.shift-DA{background:#fed7aa;color:#c2410c;border-color:#f97316;}

.memo-dot{
  width:5px;height:5px;border-radius:50%;
  background:#10b981;flex-shrink:0;
}

/* ─── Bottom Sheet / Modal ──────────────────────────────── */
#sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  opacity:0;transition:opacity .25s;
}
#detail-sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--g0);border-radius:20px 20px 0 0;
  z-index:101;max-height:92dvh;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
@media(min-width:600px){
  #detail-sheet{
    left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-50%) scale(.95);
    border-radius:var(--r);width:480px;max-height:82vh;
    box-shadow:var(--sh);
    transition:transform .2s,opacity .2s;opacity:0;
  }
  #detail-sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;}
}
@media(max-width:599px){#detail-sheet.open{transform:translateY(0);}}

.sheet-handle{
  width:36px;height:4px;background:var(--g4);
  border-radius:2px;margin:10px auto 0;flex-shrink:0;cursor:grab;
}
@media(min-width:600px){.sheet-handle{display:none;}}

.sheet-header{
  padding:12px 16px 10px;
  display:flex;align-items:center;
  border-bottom:1px solid var(--g2);flex-shrink:0;
}
.sheet-title{font-size:17px;font-weight:700;color:var(--g9);flex:1;}
.sheet-close-btn{
  width:32px;height:32px;border:none;background:var(--g2);
  border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--g6);-webkit-tap-highlight-color:transparent;
}

.sheet-body{
  overflow-y:auto;flex:1;padding:16px;
  display:flex;flex-direction:column;gap:14px;
  padding-bottom:calc(16px + var(--safe-b));
}

/* Sheet 내용 */
.shift-row{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--g1);border-radius:8px;
  font-size:14px;color:var(--g6);flex-wrap:wrap;
}
.shift-row .s-badge{
  font-size:13px;font-weight:700;padding:3px 10px;
  border-radius:6px;border:1.5px solid currentColor;
}
.shift-sel-wrap{display:flex;gap:5px;flex-wrap:wrap;}
.shift-sel-btn{
  padding:4px 10px;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:700;border-width:1.5px;border-style:solid;
  transition:transform .1s,box-shadow .1s;
}
.shift-sel-btn.sel-active{box-shadow:0 0 0 2px var(--g8);transform:scale(1.08);}
.shift-custom-inp{
  width:90px;padding:4px 8px;font-size:13px;border-radius:6px;
  border:1.5px solid var(--g3);text-transform:uppercase;
}
.readonly-note{
  font-size:12px;color:var(--g5);padding:8px 12px;
  background:var(--g1);border-radius:8px;text-align:center;
}

.section-label{font-size:12px;font-weight:600;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;}
.memo-list{display:flex;flex-direction:column;gap:8px;}
.memo-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;background:var(--g1);border-radius:8px;
  border-left:3px solid var(--g4);
}
.memo-item.t-연차{border-left-color:#f59e0b;}
.memo-item.t-대체{border-left-color:var(--pri);}
.memo-item.t-대휴{border-left-color:var(--grn);}
.memo-text{flex:1;font-size:14px;color:var(--g7);line-height:1.4;word-break:break-all;}
.memo-del{
  width:26px;height:26px;border:none;background:none;
  color:var(--g4);font-size:19px;line-height:1;padding:0;
  cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.memo-del:active{color:var(--red);}
.no-memo{text-align:center;color:var(--g5);font-size:14px;padding:20px 0;}

/* Add form */
.add-card{
  background:var(--g1);border-radius:10px;
  border:1.5px dashed var(--g4);padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.add-card.active{border-style:solid;border-color:var(--pri);background:var(--g0);}
.add-open-btn{
  display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:600;color:var(--pri);
  cursor:pointer;background:none;border:none;padding:0;
  -webkit-tap-highlight-color:transparent;font-family:inherit;
}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.type-tab{
  padding:6px 13px;border-radius:20px;border:1.5px solid var(--g3);
  background:var(--g0);font-size:13px;cursor:pointer;color:var(--g6);
  -webkit-tap-highlight-color:transparent;transition:all .15s;font-family:inherit;
}
.type-tab.active{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;}
.add-actions{display:flex;gap:8px;}
.add-actions .btn{flex:1;padding:12px;font-size:14px;}

/* ─── Loading & Toast ───────────────────────────────────── */
.page-spinner{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.8);z-index:200;
}
.spin-big{
  width:40px;height:40px;border:3px solid var(--g3);border-top-color:var(--pri);
  border-radius:50%;animation:spin .7s linear infinite;
}
.spinner{
  width:20px;height:20px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#toast{
  position:fixed;bottom:calc(var(--safe-b) + 72px);left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--g9);color:#fff;padding:10px 20px;
  border-radius:100px;font-size:14px;z-index:300;
  opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     로그인 화면
════════════════════════════════════════════════════════ -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </div>
      <div class="login-corp">Korea Airports Corporation</div>
      <div class="login-dept">한국공항공사 시스템정보부</div>
      <div class="login-title">교대근무 일정표</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="id-input">아이디 (교대 근무자)</label>
      <input type="text" id="id-input" placeholder="a / b / c / d"
             maxlength="1" autocapitalize="none" autocomplete="username">
      <div class="form-hint">교대 외 직원은 빈칸으로 두세요</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="pw-input">비밀번호</label>
      <input type="password" id="pw-input" placeholder="비밀번호 입력"
             autocomplete="current-password">
    </div>

    <div id="login-error" class="error-msg" hidden></div>
    <button class="btn btn-primary" id="login-btn">로그인</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     달력 화면
════════════════════════════════════════════════════════ -->
<div id="screen-calendar" hidden>
  <!-- 메인 헤더 -->
  <div class="cal-header">
    <button class="cal-nav-btn" id="btn-prev" aria-label="이전 달">◀</button>
    <div class="cal-month-label" id="month-label"></div>
    <button class="cal-nav-btn" id="btn-next" aria-label="다음 달">▶</button>
    <button class="cal-today-btn" id="btn-today">오늘</button>
    <button class="cal-icon-btn" id="btn-refresh" title="새로고침">↻</button>
    <button class="cal-icon-btn" id="btn-json-dl" title="JSON 다운로드">⬇</button>
    <button class="cal-icon-btn" id="btn-json-ul" title="JSON 업로드">⬆</button>
    <button class="cal-icon-btn" id="btn-logout" title="로그아웃">⏻</button>
  </div>
  <input type="file" id="json-file-input" accept=".json" style="display:none">

  <!-- 필터 표시줄 -->
  <div class="cal-subheader" id="filter-bar">
    <span class="filter-label">보기:</span>
    <span class="filter-badge" id="filter-badge"></span>
    <button class="all-view-btn" id="all-view-btn">전체 달력 보기</button>
  </div>

  <div id="notices-banner" hidden></div>
  <div id="doh-bar" hidden></div>

  <div class="cal-dow">
    <div class="dow-cell">일</div><div class="dow-cell">월</div>
    <div class="dow-cell">화</div><div class="dow-cell">수</div>
    <div class="dow-cell">목</div><div class="dow-cell">금</div>
    <div class="dow-cell">토</div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     날짜 상세 시트
════════════════════════════════════════════════════════ -->
<div id="sheet-backdrop" hidden></div>
<div id="detail-sheet" hidden>
  <div class="sheet-handle" id="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheet-title"></div>
    <button class="sheet-close-btn" id="sheet-close-btn" aria-label="닫기">✕</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- Spinner & Toast -->
<div class="page-spinner" id="page-spinner" hidden><div class="spin-big"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ── Config ─────────────────────────────────────────────── */

/* ── Supabase REST helpers ──────────────────────────────── */
const H = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json'
};

function sbSignal(ms = 12000) {
  // AbortController 방식 — iOS 12.2+ 호환 (AbortSignal.timeout보다 넓은 지원)
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), ms);
  return ctrl.signal;
}

async function sbGet(table, qs = '') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${qs}`,
    { headers: H, signal: sbSignal() });
  if (!r.ok) throw new Error(`[${table}] ${r.status}: ${await r.text()}`);
  return r.json();
}

async function sbPost(table, body, prefer = 'return=minimal') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...H, 'Prefer': prefer },
    body: JSON.stringify(body),
    signal: sbSignal()
  });
  if (!r.ok) throw new Error(`[${table}] ${r.status}: ${await r.text()}`);
}

async function sbPatch(table, filter, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH',
    headers: { ...H, 'Prefer': 'return=minimal' },
    body: JSON.stringify(body),
    signal: sbSignal()
  });
  if (!r.ok) throw new Error(`[${table}] ${r.status}: ${await r.text()}`);
}

/* ── Shift Calculation ──────────────────────────────────── */
const BASE_DATE = new Date('2025-06-02T00:00:00');
const SHIFTS    = ['AB', 'DA', 'CD', 'BC'];

function calcShift(dateStr) {
  const diff = Math.floor((new Date(dateStr + 'T00:00:00') - BASE_DATE) / 864e5);
  return SHIFTS[((diff % 4) + 4) % 4];
}

// 주어진 교대조 문자열이 특정 팀(A/B/C/D)의 근무일인지 확인
function isMyTeamDay(shift, team) {
  if (!team) return true;
  return shift.includes(team);
}

/* ── Holidays ───────────────────────────────────────────── */
const FIXED_HOL = {
  '01-01':1,'03-01':1,'05-05':1,'06-06':1,
  '08-15':1,'10-03':1,'10-09':1,'12-25':1
};
function isHoliday(y, m, d) {
  return !!FIXED_HOL[`${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`];
}

/* ── Date helpers ───────────────────────────────────────── */
const todayDt = new Date();
const TODAY   = fmtDate(todayDt);

// 이번 달 1일 (오늘 이전 달 메모 수정 불가 경계)
function thisMonthFirst() {
  const d = new Date(todayDt.getFullYear(), todayDt.getMonth(), 1);
  return fmtDate(d);
}

function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function isPastMonth(dateStr) {
  return dateStr < thisMonthFirst();
}

/* ── State ──────────────────────────────────────────────── */
let curY, curM;
let _monthData = {}; // 현재 달력 그리드 범위 데이터
let _yearData  = {}; // 연간 전체 (DOH 계산용)
let _staff     = [];
let _notices   = [];
let _carry     = {};

/* ── Data Loading ───────────────────────────────────────── */
async function loadMonth(y, m) {
  const first  = new Date(y, m-1, 1);
  const last   = new Date(y, m, 0);
  const gFrom  = fmtDate(new Date(y, m-1, 1 - first.getDay()));
  const trailDow = last.getDay();
  const gTo    = fmtDate(new Date(y, m, trailDow === 6 ? 0 : 6 - trailDow));

  const rows = await sbGet('shift_data',
    `date=gte.${gFrom}&date=lte.${gTo}&select=date,shift,memo,repeat_type`);
  _monthData = {};
  rows.forEach(r => { _monthData[r.date] = r; });
}

async function loadYearData(y) {
  const rows = await sbGet('shift_data',
    `date=gte.${y}-01-01&date=lte.${y}-12-31&select=date,shift,memo`);
  _yearData = {};
  rows.forEach(r => { if (r.memo && r.memo.length) _yearData[r.date] = r; });
}

async function loadStaff() {
  const rows = await sbGet('staff_master',
    'select=id,name,grade,shift,from_date,to_date&order=shift,name');
  _staff = rows;
}

async function loadNotices() {
  const rows = await sbGet('notices',
    `deleted_at=is.null&select=id,text,start_date,end_date&order=created_at.desc`);
  _notices = rows.filter(n =>
    (!n.start_date || n.start_date <= TODAY) &&
    (!n.end_date   || n.end_date   >= TODAY)
  );
}

async function loadCarry(y) {
  const rows = await sbGet('carry_over', `year=eq.${y}&select=name,hours`);
  _carry = {};
  rows.forEach(r => { _carry[r.name] = Number(r.hours); });
}

/* ── DOH Calculation ─────────────────────────────────────── */
function calcDoh() {
  const earned = {}, used = {};
  const src = { ..._yearData, ..._monthData };

  Object.values(src).forEach(row => {
    if (!row.memo) return;
    const shift = row.shift || calcShift(row.date);
    const dow   = new Date(row.date + 'T00:00:00').getDay();

    row.memo.forEach(line => {
      const mDae = line.match(/^대체:(.+)$/);
      if (mDae) {
        let h = 0;
        if (dow === 0 || dow === 6) h = 8;
        else if (/^[A-D]/.test(shift)) h = 11;
        if (h > 0) earned[mDae[1]] = (earned[mDae[1]] || 0) + h;
      }
      const mHu = line.match(/^대휴:([^(]+)/);
      if (mHu) used[mHu[1].trim()] = (used[mHu[1].trim()] || 0) + 8;
    });
  });

  const names = new Set([
    ...Object.keys(earned), ...Object.keys(used), ...Object.keys(_carry)
  ]);
  return [...names]
    .map(n => ({
      name: n,
      rem: (_carry[n] || 0) + (earned[n] || 0) - (used[n] || 0)
    }))
    .sort((a, b) => b.rem - a.rem);
}

/* ── Calendar Render ─────────────────────────────────────── */
function renderCalendar() {
  document.getElementById('month-label').textContent = `${curY}년 ${curM}월`;
  renderFilterBar();

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const first    = new Date(curY, curM-1, 1);
  const last     = new Date(curY, curM, 0);
  const startDow = first.getDay();

  for (let i = 0; i < startDow; i++) {
    const dt = new Date(curY, curM-1, 1 - (startDow - i));
    grid.appendChild(makeCell(dt, true));
  }
  for (let d = 1; d <= last.getDate(); d++) {
    grid.appendChild(makeCell(new Date(curY, curM-1, d), false));
  }
  const total    = startDow + last.getDate();
  const trailing = (7 - total % 7) % 7;
  for (let i = 1; i <= trailing; i++) {
    grid.appendChild(makeCell(new Date(curY, curM, i), true));
  }

  renderNotices();
  renderDoh();
}

function renderFilterBar() {
  const bar    = document.getElementById('filter-bar');
  const badge  = document.getElementById('filter-badge');
  const allBtn = document.getElementById('all-view-btn');

  const activeTeam = (!_showAll && _filterTeam) ? _filterTeam : null;

  if (activeTeam) {
    bar.hidden   = false;
    badge.textContent = `${activeTeam}조`;
    allBtn.classList.remove('active');
  } else if (_filterTeam) {
    // 필터 있지만 전체보기 중
    bar.hidden   = false;
    badge.textContent = `${_filterTeam}조`;
    allBtn.classList.add('active');
  } else {
    bar.hidden = true; // 교대 외 직원 (필터 없음)
  }
}

function makeCell(dt, other) {
  const dStr  = fmtDate(dt);
  const dow   = dt.getDay();
  const row   = _monthData[dStr] || {};
  const memos = row.memo || [];
  const shift = row.shift || calcShift(dStr);

  // 필터 모드에서 내 조 / 다른 조 판단
  const activeTeam = (!_showAll && _filterTeam) ? _filterTeam : null;
  const isMyTeam   = activeTeam ? isMyTeamDay(shift, activeTeam) : true;

  const cell = document.createElement('div');
  cell.className = 'cal-day' +
    (other     ? ' other-month' : '') +
    (dow === 0 ? ' is-sun'      : '') +
    (dow === 6 ? ' is-sat'      : '') +
    (dStr === TODAY ? ' is-today' : '') +
    (isHoliday(dt.getFullYear(), dt.getMonth()+1, dt.getDate()) ? ' is-holiday' : '') +
    (activeTeam && isMyTeam  && !other ? ' my-shift'  : '') +
    (activeTeam && !isMyTeam && !other ? ' dim-shift' : '');
  cell.dataset.date = dStr;

  const top = document.createElement('div');
  top.className = 'cell-top';

  const num = document.createElement('div');
  num.className   = 'day-num';
  num.textContent = dt.getDate();
  top.appendChild(num);

  if (!other) {
    const badge       = document.createElement('div');
    badge.className   = `shift-badge shift-${shift}`;
    badge.textContent = shift;
    top.appendChild(badge);
  }
  cell.appendChild(top);

  if (memos.length > 0) {
    const dot   = document.createElement('div');
    dot.className = 'memo-dot';
    cell.appendChild(dot);
  }

  cell.addEventListener('click', () => openSheet(dStr));
  return cell;
}

/* ── Notices / DOH ──────────────────────────────────────── */
function renderNotices() {
  const el = document.getElementById('notices-banner');
  if (!_notices.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = _notices.slice(0, 3)
    .map(n => `<div class="notice-line">📢 ${escH(n.text)}</div>`).join('');
}

function renderDoh() {
  const bar = document.getElementById('doh-bar');
  const doh = calcDoh();
  if (!doh.length) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = doh.map(d => {
    const cls  = d.rem > 0 ? 'doh-pos' : d.rem < 0 ? 'doh-neg' : 'doh-zero';
    const sign = d.rem > 0 ? '+' : '';
    return `<span class="doh-chip ${cls}">${escH(d.name)} ${sign}${d.rem}h</span>`;
  }).join('');
}

/* ── Detail Sheet ─────────────────────────────────────────── */
let _curDate = null;
let _addOpen = false;
let _addType = '메모';

function openSheet(dStr) {
  _curDate = dStr;
  _addOpen = false;
  _addType = '메모';

  const dt  = new Date(dStr + 'T00:00:00');
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  document.getElementById('sheet-title').textContent =
    `${dt.getMonth()+1}월 ${dt.getDate()}일 (${dow})`;

  rebuildSheet();

  const bd = document.getElementById('sheet-backdrop');
  const sh = document.getElementById('detail-sheet');
  bd.hidden = false;
  sh.hidden = false;
  requestAnimationFrame(() => {
    bd.style.opacity = '1';
    sh.classList.add('open');
  });
}

function closeSheet() {
  const bd = document.getElementById('sheet-backdrop');
  const sh = document.getElementById('detail-sheet');
  bd.style.opacity = '0';
  sh.classList.remove('open');
  setTimeout(() => {
    bd.hidden = true;
    sh.hidden = true;
    _curDate  = null;
  }, 300);
}

function rebuildSheet() {
  const body   = document.getElementById('sheet-body');
  const row    = _monthData[_curDate] || {};
  const shift  = row.shift || calcShift(_curDate);
  const memos  = row.memo || [];
  const isPast = isPastMonth(_curDate);

  // 교대조 편집 행
  const shiftBtns = ['AB','BC','CD','DA']
    .map(s => `<button class="shift-sel-btn shift-badge shift-${s}${shift===s?' sel-active':''}" data-shift="${s}">${s}</button>`)
    .join('');
  let html = `<div class="shift-row">
    <span style="flex-shrink:0">교대조</span>
    <div class="shift-sel-wrap">${shiftBtns}</div>
    ${isPast ? '' : `<input class="shift-custom-inp" id="shift-custom-inp" maxlength="4"
      placeholder="직접입력" value="${!['AB','BC','CD','DA'].includes(shift)?escH(shift):''}"
      style="text-transform:uppercase">`}
  </div>`;

  if (isPast) {
    html += `<div class="readonly-note">📌 지난 달 일정 — 읽기 전용</div>`;
  }

  // Memo list
  html += `<div><div class="section-label" style="margin-bottom:8px">일정 메모</div>`;
  if (!memos.length) {
    html += `<div class="no-memo">등록된 일정이 없습니다</div>`;
  } else {
    html += `<div class="memo-list">`;
    memos.forEach((line, i) => {
      const type    = line.split(':')[0];
      const typeCls = ['연차','대체','대휴'].includes(type) ? `t-${type}` : '';
      const delBtn  = isPast ? '' :
        `<button class="memo-del" data-idx="${i}" aria-label="삭제">×</button>`;
      html += `<div class="memo-item ${typeCls}">
        <span class="memo-text">${escH(fmtLine(line))}</span>
        ${delBtn}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // Add form (과거 달은 표시 안 함)
  if (!isPast) html += buildAddForm();

  body.innerHTML = html;

  body.querySelectorAll('.memo-del').forEach(btn => {
    btn.addEventListener('click', () => onDelMemo(parseInt(btn.dataset.idx)));
  });

  // 교대조 버튼
  body.querySelectorAll('.shift-sel-btn').forEach(btn => {
    btn.addEventListener('click', () => onShiftChange(btn.dataset.shift));
  });
  const customInp = body.querySelector('#shift-custom-inp');
  customInp?.addEventListener('change', () => {
    const v = customInp.value.trim().toUpperCase();
    if (v) onShiftChange(v);
  });

  bindAddForm();
}

function fmtLine(line) {
  const [type, ...rest] = line.split(':');
  const labels = { '연차':'연차', '대체':'대체근무', '대휴':'대휴사용' };
  return labels[type] ? `${labels[type]}: ${rest.join(':')}` : line;
}

function buildAddForm() {
  if (!_addOpen) {
    return `<div class="add-card" id="add-card">
      <button class="add-open-btn" id="add-open-btn">＋ 일정 추가</button>
    </div>`;
  }
  const types = ['메모','연차','대체','대휴','교육','출장','기타'];
  let f = `<div class="add-card active" id="add-card">
    <div class="type-tabs">
      ${types.map(t =>
        `<button class="type-tab${_addType===t?' active':''}" data-type="${t}">${t}</button>`
      ).join('')}
    </div>`;

  if (_addType === '메모') {
    f += `<textarea id="add-input" placeholder="메모 내용 입력" rows="2"></textarea>`;
  } else if (_addType === '대휴') {
    f += `<select id="add-input">${staffOpts(_curDate)}</select>
          <input type="date" id="add-ref" placeholder="원 대체일 (선택)" style="margin-top:4px">`;
  } else if (['교육','출장','기타'].includes(_addType)) {
    f += `<select id="add-input">${staffOpts(_curDate)}</select>
          <input type="text" id="add-ref" placeholder="${_addType}명/비고 (선택)" style="margin-top:4px">`;
  } else {
    f += `<select id="add-input">${staffOpts(_curDate)}</select>`;
  }

  f += `<div class="add-actions">
    <button class="btn btn-secondary" id="add-cancel">취소</button>
    <button class="btn btn-primary"   id="add-save">저장</button>
  </div></div>`;
  return f;
}

function staffOpts(dateStr) {
  const active = _staff.filter(s =>
    (!s.from_date || s.from_date <= dateStr) &&
    (!s.to_date   || s.to_date   >= dateStr)
  );
  if (!active.length) return '<option value="">— 직원 없음 —</option>';
  return '<option value="">— 직원 선택 —</option>' +
    active.map(s =>
      `<option value="${escA(s.name)}">${escH(s.name)} (${escH(s.shift)})</option>`
    ).join('');
}

function bindAddForm() {
  document.getElementById('add-open-btn')?.addEventListener('click', () => {
    _addOpen = true; rebuildSheet();
  });
  document.getElementById('add-cancel')?.addEventListener('click', () => {
    _addOpen = false; rebuildSheet();
  });
  document.querySelectorAll('.type-tab').forEach(tab => {
    tab.addEventListener('click', () => { _addType = tab.dataset.type; rebuildSheet(); });
  });
  document.getElementById('add-save')?.addEventListener('click', onSaveMemo);
  const inp = document.getElementById('add-input');
  if (inp) setTimeout(() => inp.focus(), 60);
}

/* ── Memo CRUD ─────────────────────────────────────────────── */
async function onSaveMemo() {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }

  const inp = document.getElementById('add-input');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) { toast('내용을 입력하세요'); return; }

  let line;
  if (_addType === '메모') {
    line = val;
  } else if (_addType === '대휴') {
    const ref = document.getElementById('add-ref')?.value;
    line = `대휴:${val}` + (ref ? `(${ref})` : '');
  } else if (['교육','출장','기타'].includes(_addType)) {
    const ref = document.getElementById('add-ref')?.value.trim();
    line = `${_addType}:${val}` + (ref ? `(${ref})` : '');
  } else {
    line = `${_addType}:${val}`;
  }

  const btn = document.getElementById('add-save');
  btn.disabled = true;
  try {
    const existing  = _monthData[_curDate];
    const existMemo = existing?.memo || [];
    if (existMemo.includes(line)) {
      toast('이미 동일한 내용이 있습니다'); btn.disabled = false; return;
    }
    const newMemo = [...existMemo, line];
    await writeMemo(_curDate, newMemo, existing);
    updateLocalCache(_curDate, newMemo);
    _addOpen = false;
    rebuildSheet();
    renderCalendar();
    toast('저장했습니다');
  } catch(e) {
    toast('저장 실패: ' + e.message);
    btn.disabled = false;
  }
}

async function onDelMemo(idx) {
  if (isPastMonth(_curDate)) { toast('지난 달 일정은 수정할 수 없습니다'); return; }
  const row = _monthData[_curDate];
  if (!row?.memo) return;
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  const newMemo = row.memo.filter((_, i) => i !== idx);
  try {
    await writeMemo(_curDate, newMemo, row);
    updateLocalCache(_curDate, newMemo);
    rebuildSheet();
    renderCalendar();
    toast('삭제했습니다');
  } catch(e) {
    toast('삭제 실패: ' + e.message);
  }
}

// shift 값 보존, source='mobile' 으로 저장
async function writeMemo(dateStr, newMemo, existingRow) {
  const now = new Date().toISOString();
  if (existingRow) {
    await sbPatch('shift_data', `date=eq.${dateStr}`, {
      memo: newMemo, source: 'mobile', updated_at: now
    });
  } else {
    await sbPost('shift_data', {
      date: dateStr, shift: null, memo: newMemo, source: 'mobile', updated_at: now
    }, 'resolution=merge-duplicates,return=minimal');
  }
}

async function onShiftChange(newShift) {
  if (isPastMonth(_curDate)) { toast('지난 달은 수정할 수 없습니다'); return; }
  if (!newShift) return;
  newShift = newShift.toUpperCase();
  const now = new Date().toISOString();
  try {
    const existing = _monthData[_curDate];
    if (existing) {
      await sbPatch('shift_data', `date=eq.${_curDate}`, { shift: newShift, updated_at: now });
    } else {
      await sbPost('shift_data',
        { date: _curDate, shift: newShift, memo: [], source: 'mobile', updated_at: now },
        'resolution=merge-duplicates,return=minimal');
    }
    if (!_monthData[_curDate]) _monthData[_curDate] = { date: _curDate, shift: null, memo: [] };
    _monthData[_curDate].shift = newShift;
    rebuildSheet();
    renderCalendar();
    toast(`교대조 → ${newShift}`);
  } catch(e) { toast('저장 실패: ' + e.message); }
}

/* ── JSON 다운로드 ────────────────────────────────────────── */
async function downloadJson() {
  spinner(true);
  try {
    const rows = await sbGet('shift_data', 'select=date,shift,memo,repeat_type&order=date');
    const out = {};
    rows.forEach(r => {
      if (r.shift || (r.memo && r.memo.length) || r.repeat_type) {
        out[r.date] = {};
        if (r.shift) out[r.date].shift = r.shift;
        if (r.memo && r.memo.length) out[r.date].memo = r.memo;
        if (r.repeat_type) out[r.date].repeat = r.repeat_type;
      }
    });
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `shiftcal_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('JSON 다운로드 완료');
  } catch(e) { toast('다운로드 실패: ' + e.message); }
  finally { spinner(false); }
}

/* ── JSON 업로드 ─────────────────────────────────────────── */
async function uploadJson(file) {
  if (!file) return;
  spinner(true);
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    // shiftCalendar_data.json 형식: { "YYYY-MM-DD": { shift, memo, repeat } }
    // 또는 중첩 형식 지원
    const rows = [];
    const entries = data.cal || data; // cal 키 없으면 최상위가 날짜 데이터
    for (const [date, val] of Object.entries(entries)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      rows.push({
        date,
        shift:       val.shift || null,
        memo:        Array.isArray(val.memo) ? val.memo : [],
        repeat_type: val.repeat || null,
        source:      'desktop',
        updated_at:  new Date().toISOString()
      });
    }
    if (!rows.length) { toast('날짜 데이터가 없습니다'); return; }
    // 100건씩 나눠서 UPSERT
    for (let i = 0; i < rows.length; i += 100) {
      await sbPost('shift_data', rows.slice(i, i + 100), 'resolution=merge-duplicates,return=minimal');
    }
    toast(`${rows.length}건 업로드 완료`);
    await Promise.all([loadMonth(curY, curM), loadYearData(curY), loadCarry(curY)]);
    renderCalendar();
  } catch(e) { toast('업로드 실패: ' + e.message); }
  finally { spinner(false); }
}

function updateLocalCache(dateStr, newMemo) {
  if (!_monthData[dateStr]) _monthData[dateStr] = { date: dateStr, shift: null, memo: [] };
  _monthData[dateStr].memo = newMemo;
  if (_yearData[dateStr]) _yearData[dateStr].memo = newMemo;
  else if (newMemo.length) _yearData[dateStr] = { date: dateStr, memo: newMemo };
}

/* ── Touch Swipe to Close ────────────────────────────────── */
function initSwipe() {
  if (window.innerWidth >= 600) return;
  const sh   = document.getElementById('detail-sheet');
  const hand = document.getElementById('sheet-handle');
  let sy = 0, cy = 0;

  hand.addEventListener('touchstart', e => {
    sy = e.touches[0].clientY; cy = 0; sh.style.transition = 'none';
  }, { passive: true });
  hand.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - sy;
    if (dy < 0) return;
    cy = dy; sh.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  hand.addEventListener('touchend', () => {
    sh.style.transition = '';
    if (cy > 100) closeSheet(); else sh.style.transform = 'translateY(0)';
  });
}

/* ── Utilities ───────────────────────────────────────────── */
function escH(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function spinner(on) { document.getElementById('page-spinner').hidden = !on; }
function showScreen(n) {
  document.getElementById('screen-login').hidden    = n !== 'login';
  document.getElementById('screen-calendar').hidden = n !== 'calendar';
}

/* ── Month Navigation ────────────────────────────────────── */
async function goMonth(delta) {
  curM += delta;
  if (curM > 12) { curM = 1; curY++; }
  if (curM < 1)  { curM = 12; curY--; }
  spinner(true);
  try { await loadMonth(curY, curM); renderCalendar(); }
  catch(e) { toast('로드 실패: ' + e.message); }
  finally  { spinner(false); }
}

/* ── Full Init ───────────────────────────────────────────── */
async function initApp() {
  curY = todayDt.getFullYear();
  curM = todayDt.getMonth() + 1;
  showScreen('calendar');
  spinner(true);
  try {
    await Promise.all([
      loadMonth(curY, curM),
      loadYearData(curY),
      loadStaff(),
      loadNotices(),
      loadCarry(curY)
    ]);
  } catch(e) {
    console.error('Supabase 로드 실패:', e);
    // 연결 실패 시에도 달력은 표시 (계산된 교대조로 표시)
    toast('서버 연결 실패 — 오프라인 모드로 표시합니다');
  } finally {
    spinner(false);
  }
  // 데이터 유무 관계없이 달력 렌더 + 스와이프 초기화
  renderCalendar();
  initSwipe();
}

/* ── Event Listeners ─────────────────────────────────────── */
// Login
document.getElementById('login-btn').addEventListener('click', async () => {
  const id  = document.getElementById('id-input').value.trim().toLowerCase();
  const pw  = document.getElementById('pw-input').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  if (!pw) { err.textContent = '비밀번호를 입력하세요'; err.hidden = false; return; }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  err.hidden = true;
  try {
    await doLogin(id, pw);
    await initApp();
  } catch(e) {
    err.textContent = e.message; err.hidden = false;
    btn.disabled = false; btn.textContent = '로그인';
  }
});
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// Calendar navigation
document.getElementById('btn-prev').addEventListener('click', () => goMonth(-1));
document.getElementById('btn-next').addEventListener('click', () => goMonth(1));
document.getElementById('btn-today').addEventListener('click', async () => {
  const ny = todayDt.getFullYear(), nm = todayDt.getMonth()+1;
  if (ny !== curY || nm !== curM) {
    curY = ny; curM = nm;
    spinner(true);
    try { await loadMonth(curY, curM); } finally { spinner(false); }
  }
  renderCalendar();
});

// Refresh
document.getElementById('btn-refresh').addEventListener('click', async () => {
  spinner(true);
  try {
    await Promise.all([
      loadMonth(curY, curM), loadYearData(curY),
      loadStaff(), loadNotices(), loadCarry(curY)
    ]);
    renderCalendar(); toast('새로고침했습니다');
  } catch(e) { toast('새로고침 실패'); }
  finally    { spinner(false); }
});

// Logout
document.getElementById('btn-logout').addEventListener('click', () => {
  if (confirm('로그아웃하시겠습니까?')) doLogout();
});
document.getElementById('btn-json-dl').addEventListener('click', downloadJson);
document.getElementById('btn-json-ul').addEventListener('click', () => {
  document.getElementById('json-file-input').click();
});
document.getElementById('json-file-input').addEventListener('change', e => {
  if (e.target.files[0]) uploadJson(e.target.files[0]);
  e.target.value = '';
});

// 전체 달력 보기 토글
document.getElementById('all-view-btn').addEventListener('click', () => {
  _showAll = !_showAll;
  renderCalendar();
});

// Sheet
document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (document.getElementById('screen-calendar').hidden) return;
  if (e.key === 'ArrowLeft')  goMonth(-1);
  if (e.key === 'ArrowRight') goMonth(1);
});

/* ── Bootstrap ───────────────────────────────────────────── */
if (isAuthed()) {
  applyFilter();
  initApp();
} else {
  showScreen('login');
}

// Service Worker 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
